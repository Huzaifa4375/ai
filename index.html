<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gavio AI</title>
<style>
:root{
  --bg:#06070c;
  --panel:#0d1018;
  --panel2:#151b29;
  --side:#040509;
  --line:#1e2638;
  --txt:#f3f5fa;
  --mut:#8c96ab;
  --acc:#6366f1;
  --acc2:#818cf8;
  --mint:#10b981;
  --user:#192236;
  --code:#04060a;
  --err:#fb7185;
  --errbg:#290e16;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);
  color:var(--txt);
  font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
button{
  cursor:pointer;
  touch-action:manipulation;
  transition:transform .12s cubic-bezier(.22,1,.36,1), background-color .16s ease, border-color .16s ease, opacity .16s ease;
}
button:hover{filter:brightness(1.08)}
button:active{transform:scale(.97)}

/* Smooth Animations */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes popIn{
  from{opacity:0;transform:scale(.96)}
  to{opacity:1;transform:scale(1)}
}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* Auth Screen */
#auth{
  position:fixed;inset:0;z-index:9999;
  background:
    radial-gradient(640px 300px at 50% 0%, rgba(99,102,241,.22), transparent),
    radial-gradient(520px 280px at 85% 15%, rgba(16,185,129,.14), transparent),
    var(--bg);
  display:none;align-items:center;justify-content:center;padding:16px;overflow-y:auto;
}
#auth.show{display:flex;animation:fadeUp .22s ease}

.auth-card{
  width:min(400px,100%);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:20px;
  padding:22px;
  box-shadow:0 24px 64px rgba(0,0,0,.78);
  display:flex;flex-direction:column;gap:13px;
  margin:auto;
  animation:popIn .24s cubic-bezier(.22,1,.36,1);
}
.top-b{display:flex;align-items:center;gap:10px}
.badge{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,var(--acc),var(--mint));
  display:grid;place-items:center;
  font-weight:800;font-size:17px;color:#fff;flex-shrink:0;
  box-shadow:0 6px 18px rgba(99,102,241,.35);
}
.top-b h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em}
.sub{margin:0;color:var(--mut);font-size:13px}

.demo-btn{
  width:100%;padding:11px 14px;border-radius:11px;
  border:1px solid rgba(16,185,129,.45);
  background:linear-gradient(135deg,rgba(16,185,129,.2),rgba(99,102,241,.2));
  color:#ecfdf5;font-weight:600;font-size:13.5px;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.demo-btn:hover{border-color:var(--mint)}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);padding:4px;border-radius:11px;border:1px solid var(--line)}
.tbtn{border:0;background:transparent;padding:8px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--mut)}
.tbtn.on{background:var(--panel2);color:var(--txt)}

.gbtn{
  width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--line);
  background:var(--panel2);display:flex;align-items:center;justify-content:center;gap:9px;
  font-weight:500;font-size:13.5px;
}
.gbox{display:none;flex-direction:column;gap:8px;padding:10px;border-radius:11px;background:var(--bg);border:1px solid var(--line)}
.gbox.open{display:flex;animation:fadeUp .18s ease}
.gbox small{color:var(--mut);font-size:12px}

.or{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

.grp{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:500;color:var(--mut)}
.grp input{
  border:1px solid var(--line);background:var(--bg);border-radius:10px;
  padding:9px 11px;font-size:14px;width:100%;transition:border-color .16s ease;
}
.grp input:focus{border-color:var(--acc2);outline:none}

.go-auth{
  width:100%;padding:11px 14px;border-radius:11px;border:0;
  background:linear-gradient(135deg,var(--acc),#4f46e5);
  color:#fff;font-weight:600;font-size:14px;
}
.err-txt{min-height:18px;font-size:12.5px;color:var(--err)}

/* Workspace */
#ws{display:flex;width:100%;height:100%}
#ws.hide{display:none}

#side{
  width:260px;background:var(--side);border-right:1px solid var(--line);
  display:flex;flex-direction:column;flex-shrink:0;
  transition:transform .24s cubic-bezier(.22,1,.36,1);
}
.s-head{padding:15px 14px 8px;display:flex;align-items:center;gap:10px}
.s-head span{font-weight:700;font-size:18px;letter-spacing:-.02em}
#new-c{
  margin:8px 12px 10px;padding:9px 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--panel);
  display:flex;align-items:center;justify-content:space-between;font-size:13.5px;font-weight:500;
}
#new-c kbd{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mut);background:var(--bg);padding:2px 6px;border-radius:5px;border:1px solid var(--line)}
#c-list{flex:1;overflow-y:auto;padding:0 8px}
.c-row{display:flex;align-items:center;gap:4px;border-radius:9px;padding:0 4px 0 10px;margin-bottom:2px;transition:background-color .15s ease}
.c-row:hover,.c-row.on{background:var(--panel2)}
.c-row .pick{flex:1;min-width:0;padding:8px 0;border:0;background:none;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.c-row .del{border:0;background:none;color:var(--mut);padding:4px 7px;border-radius:6px;opacity:.6;font-size:12px}
.c-row:hover .del{opacity:1}
.c-row .del:hover{color:var(--err);background:var(--errbg)}

.s-foot{padding:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.s-foot button{
  width:100%;padding:8px 10px;border-radius:9px;border:0;background:none;
  display:flex;align-items:center;gap:10px;text-align:left;color:var(--mut);font-size:13.5px;
}
.s-foot button:hover{background:var(--panel);color:var(--txt)}
.av{
  width:24px;height:24px;border-radius:50%;
  background:linear-gradient(135deg,var(--acc),var(--mint));
  color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0;
}
.u-nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--txt);font-weight:500}

.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
header{
  display:flex;align-items:center;gap:10px;padding:11px 18px;
  border-bottom:1px solid var(--line);background:var(--panel);
}
#m-btn{display:none;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:5px 10px}
#c-title{font-weight:600;font-size:14.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#m-pill{
  font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--acc2);
  background:rgba(99,102,241,.14);border:1px solid rgba(99,102,241,.35);
  border-radius:999px;padding:3px 11px;
}

#scroll{flex:1;overflow-y:auto;scroll-behavior:smooth}
.col{max-width:760px;margin:0 auto;padding:24px 20px 14px}

.empty{padding-top:9vh;animation:fadeUp .28s ease}
.empty h1{margin:0 0 8px;font-size:clamp(28px,4.5vw,38px);letter-spacing:-.02em}
.empty p{margin:0 0 20px;color:var(--mut);max-width:48ch}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:9px 14px;font-size:13.5px;text-align:left}
.chip:hover{border-color:var(--acc2);background:var(--panel2);transform:translateY(-1px)}

.msg{margin:0 0 20px;animation:fadeUp .2s ease}
.msg.u{display:flex;justify-content:flex-end}
.msg.u .b{background:var(--user);border:1px solid var(--line);padding:10px 15px;border-radius:16px 16px 4px 16px;max-width:82%;white-space:pre-wrap;font-size:14.5px}
.msg.a{display:flex;gap:12px;align-items:flex-start}
.msg.a .w{min-width:0;flex:1}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md p,.md ul,.md ol,.md pre,.md table,.md blockquote{margin:0 0 12px}
.md h1,.md h2,.md h3{margin:14px 0 8px;line-height:1.3}
.md a{color:var(--acc2)}
.md pre{position:relative;background:var(--code);border-radius:11px;overflow:hidden;border:1px solid var(--line)}
.md pre code{display:block;background:none;padding:14px;overflow-x:auto;color:#e6ecff;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}
.md code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--panel2);padding:2px 6px;border-radius:5px}
.cp{position:absolute;top:8px;right:8px;border:1px solid var(--line);background:var(--panel2);color:var(--mut);border-radius:7px;padding:3px 9px;font-size:12px}
.acts{display:flex;gap:4px;margin-top:6px}
.acts button{border:0;background:none;color:var(--mut);padding:3px 8px;border-radius:6px;font-size:12.5px}
.acts button:hover{background:var(--panel2);color:var(--txt)}

.cursor{display:inline-block;width:7px;height:15px;background:var(--acc2);vertical-align:middle;margin-left:3px;border-radius:2px;animation:blink .75s infinite}

.pill{display:inline-flex;align-items:center;gap:8px;padding:5px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mut);margin-bottom:8px}
.pill.done{opacity:.72}
.sp{width:11px;height:11px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--acc2);animation:rot .65s linear infinite}
.dt{width:8px;height:8px;border-radius:50%;background:var(--mint)}
.errb{background:var(--errbg);color:var(--err);padding:10px 14px;border-radius:10px;margin-top:8px;font-size:13.5px;white-space:pre-wrap}

.comp{padding:0 20px 18px;background:var(--bg)}
.cbox{max-width:760px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;display:flex;align-items:flex-end;gap:8px;padding:8px 8px 8px 16px;transition:border-color .16s ease, box-shadow .16s ease}
.cbox:focus-within{border-color:var(--acc2);box-shadow:0 0 0 3px rgba(99,102,241,.14)}
#inp{flex:1;border:0;background:none;color:inherit;font:inherit;resize:none;max-height:200px;padding:6px 0;outline:none}
#send{border:0;background:var(--acc);color:#fff;border-radius:11px;width:36px;height:36px;font-size:17px;flex-shrink:0;font-weight:700}
#send.dim{opacity:.45}
.hint{text-align:center;color:var(--mut);font-size:12px;margin-top:7px}

.ov{position:fixed;inset:0;z-index:9998;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px}
.ov.open{display:flex;animation:fadeUp .18s ease}
.mcard{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:13px;animation:popIn .2s cubic-bezier(.22,1,.36,1)}
.mcard h2{margin:0;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.mcard label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500}
.mcard small{color:var(--mut);font-weight:400;font-size:12px}
.mcard input,.mcard textarea,.mcard select{border:1px solid var(--line);background:var(--bg);color:inherit;border-radius:10px;padding:9px 11px;font:inherit;width:100%}
.mrow{display:flex;gap:10px;justify-content:flex-end;margin-top:4px}
.b2{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 14px;font-size:13.5px;font-weight:500}
.b1{border:0;background:var(--acc);color:#fff;border-radius:10px;padding:8px 16px;font-size:13.5px;font-weight:600}

@media (max-width:760px){
  #side{position:fixed;inset:0 auto 0 0;z-index:30;transform:translateX(-100%)}
  #side.open{transform:none}
  #m-btn{display:block}
  #m-pill,#new-c kbd{display:none}
}
</style>
</head>
<body>

<div id="auth">
  <div class="auth-card">
    <div class="top-b">
      <div class="badge">G</div>
      <h1>Gavio AI</h1>
    </div>
    <p class="sub">Sign in or register to open Gavio AI.</p>

    <button type="button" class="demo-btn" data-act="demo-login">⚡ Instant Demo Sign In</button>

    <div class="tabs">
      <button type="button" class="tbtn on" id="tab-in" data-act="tab-login">Sign In</button>
      <button type="button" class="tbtn" id="tab-up" data-act="tab-register">Register</button>
    </div>

    <button type="button" class="gbtn" data-act="google-open">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.7 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.6c-.3 1.5-1.1 2.8-2.4 3.6v3h3.9c2.3-2.1 3.6-5.2 3.6-8.8z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-3l-3.9-3c-1.1.7-2.5 1.2-4.1 1.2-3.2 0-5.9-2.1-6.8-5H1.2v3.1C3.2 21.3 7.3 24 12 24z"/><path fill="#FBBC05" d="M5.2 14.2c-.2-.7-.4-1.5-.4-2.2s.2-1.5.4-2.2V6.7H1.2C.4 8.3 0 10.1 0 12s.4 3.7 1.2 5.3l4-3.1z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4C17.9 1.2 15.2 0 12 0 7.3 0 3.2 2.7 1.2 6.7l4 3.1c.9-2.9 3.6-5 6.8-5z"/></svg>
      Continue with Google
    </button>

    <div class="gbox" id="gbox">
      <small>Enter your Google email:</small>
      <div style="display:flex;gap:8px">
        <input id="g-mail" type="email" placeholder="you@gmail.com" style="flex:1;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 10px">
        <button type="button" class="b1" data-act="google-go">Continue</button>
      </div>
    </div>

    <div class="or">or continue with email</div>

    <div class="grp" id="name-grp" style="display:none">
      <label for="in-name">Name</label>
      <input id="in-name" type="text" placeholder="Your name">
    </div>

    <div class="grp">
      <label for="in-mail">Email</label>
      <input id="in-mail" type="email" placeholder="you@example.com">
    </div>

    <div class="grp">
      <label for="in-pw">Password</label>
      <input id="in-pw" type="password" placeholder="Password">
    </div>

    <div class="err-txt" id="a-err"></div>

    <button type="button" class="go-auth" id="a-go" data-act="auth-submit">Sign In</button>
  </div>
</div>

<div id="ws">
  <aside id="side">
    <div class="s-head">
      <div class="badge" style="width:28px;height:28px;font-size:14px;border-radius:9px">G</div>
      <span>Gavio AI</span>
    </div>
    <button type="button" id="new-c" data-act="new-chat"><span>+ New chat</span><kbd>Ctrl K</kbd></button>
    <div id="c-list"></div>
    <div class="s-foot">
      <button type="button" data-act="open-prof">
        <span class="av" id="s-av">D</span>
        <span class="u-nm" id="s-nm">Demo User</span>
      </button>
      <button type="button" data-act="open-set">⚙ Settings &amp; API Key</button>
      <button type="button" data-act="sign-out" style="color:var(--err)">↪ Sign out</button>
    </div>
  </aside>

  <div class="main">
    <header>
      <button type="button" id="m-btn" data-act="toggle-side">☰</button>
      <div id="c-title">New chat</div>
      <button type="button" id="m-pill" data-act="open-set">gemini-2.5-flash</button>
    </header>
    <div id="scroll">
      <div class="col" id="msgs"></div>
    </div>
    <div class="comp">
      <div class="cbox">
        <textarea id="inp" rows="1" placeholder="Message Gavio AI…"></textarea>
        <button type="button" id="send" class="dim" data-act="send-or-stop" aria-label="Send message">↑</button>
      </div>
      <div class="hint">Enter to send · Shift+Enter for new line</div>
    </div>
  </div>
</div>

<div class="ov" id="ov-set">
  <div class="mcard">
    <h2><span>Settings</span><button type="button" class="b2" style="padding:3px 9px" data-act="close-set">✕</button></h2>
    <label>Gemini API Key (AIza...)
      <input id="k-inp" type="password" placeholder="AIzaSy... (leave blank for built-in Smart Demo)" autocomplete="off">
      <small>Standard browser Gemini keys start with AIza. If blank or blocked, Smart Demo Mode responds smoothly.</small>
    </label>
    <label>Model
      <select id="m-inp">
        <option value="gemini-2.5-flash">gemini-2.5-flash</option>
        <option value="gemini-2.5-pro">gemini-2.5-pro</option>
        <option value="gemini-2.5-flash-lite">gemini-2.5-flash-lite</option>
        <option value="smart-demo">smart-demo (instant offline)</option>
      </select>
    </label>
    <label>System Prompt
      <textarea id="s-inp" rows="2" placeholder="Optional instructions for Gavio AI..."></textarea>
    </label>
    <label>Temperature <small id="t-val">0.7</small>
      <input id="t-inp" type="range" min="0" max="2" step="0.1" value="0.7">
    </label>
    <div class="mrow">
      <button type="button" class="b2" data-act="close-set">Cancel</button>
      <button type="button" class="b1" data-act="save-set">Save</button>
    </div>
  </div>
</div>

<div class="ov" id="ov-prof">
  <div class="mcard">
    <h2><span>Profile</span><button type="button" class="b2" style="padding:3px 9px" data-act="close-prof">✕</button></h2>
    <div style="display:flex;align-items:center;gap:12px">
      <div class="av" id="p-av" style="width:42px;height:42px;font-size:17px">D</div>
      <div>
        <div id="p-nm" style="font-weight:600">Demo User</div>
        <div id="p-em" style="color:var(--mut);font-size:13px">demo@gavio.ai</div>
      </div>
    </div>
    <div class="mrow">
      <button type="button" class="b2" data-act="sign-out" style="color:var(--err);border-color:var(--err)">Sign out</button>
    </div>
  </div>
</div>

<script>
(function(){
  const DEFAULT_KEY = "AQ.Ab8RN6JAgW2dzmZXOrCuNl_QrCsZlJKZNaIeG_RLh8_wylLP5A";
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));

  /* Safe Storage (never throws in sandboxed iframes) */
  const mem = {};
  function rd(k){
    try { const v = window.localStorage.getItem(k); if (v !== null) return v; } catch {}
    return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null;
  }
  function wr(k, v){
    mem[k] = String(v);
    try { window.localStorage.setItem(k, String(v)); } catch {}
  }

  function hsh(salt, pw){
    const s = salt + ":" + pw;
    let a = 0x811c9dc5, b = 0x01000193;
    for (let i = 0; i < s.length; i++){
      const c = s.charCodeAt(i);
      a = Math.imul(a ^ c, 0x01000193) >>> 0;
      b = Math.imul(b ^ (c + i), 0x85ebca6b) >>> 0;
    }
    return a.toString(16).padStart(8,"0") + b.toString(16).padStart(8,"0");
  }

  let accs = { users: {}, user: { email: "demo@gavio.ai", name: "Demo User" } };
  try {
    const p = JSON.parse(rd("gavio_acc_v2") || "null");
    if (p && typeof p === "object") {
      accs.users = p.users || {};
      if ("user" in p) accs.user = p.user;
    }
  } catch {}
  function saveAccs(){ wr("gavio_acc_v2", JSON.stringify(accs)); }

  const defCfg = { key: DEFAULT_KEY, model: "gemini-2.5-flash", system: "", temp: 0.7 };
  let ws = { chats: [], active: null, cfg: { ...defCfg } };

  function loadWs(){
    if (!accs.user) { ws = { chats: [], active: null, cfg: { ...defCfg } }; return; }
    try {
      const r = JSON.parse(rd("gavio_ws_v2_" + accs.user.email) || "null");
      if (r && typeof r === "object") {
        ws.chats = Array.isArray(r.chats) ? r.chats : [];
        ws.active = typeof r.active === "string" ? r.active : null;
        ws.cfg = Object.assign({}, defCfg, r.cfg || {});
      } else {
        ws = { chats: [], active: null, cfg: { ...defCfg } };
      }
    } catch {
      ws = { chats: [], active: null, cfg: { ...defCfg } };
    }
  }
  function saveWs(){
    if (!accs.user) return;
    wr("gavio_ws_v2_" + accs.user.email, JSON.stringify(ws));
  }

  let busy = false, ac = null, liveMd = null, livePill = null, raf = 0, mode = "login";

  /* Self-contained clean Markdown formatter (works offline without CDN lag) */
  function renderMarkdown(src){
    const text = String(src || "");
    const blocks = [];
    let safe = text.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, (_, lang, code) => {
      const idx = blocks.length;
      blocks.push(`<pre><code class="lang-${esc(lang)}">${esc(code.replace(/\n$/,""))}</code><button type="button" class="cp" data-act="copy-code">Copy</button></pre>`);
      return `\u0000BLOCK${idx}\u0000`;
    });
    safe = esc(safe)
      .replace(/`([^`\n]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\*([^*\n]+)\*/g, "<em>$1</em>")
      .replace(/^### (.+)$/gm, "<h3>$1</h3>")
      .replace(/^## (.+)$/gm, "<h2>$1</h2>")
      .replace(/^# (.+)$/gm, "<h1>$1</h1>")
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

    const lines = safe.split("\n");
    let out = "", inUl = false, inOl = false;
    for (const ln of lines){
      const ul = ln.match(/^\s*[-*]\s+(.+)/);
      const ol = ln.match(/^\s*\d+\.\s+(.+)/);
      if (ul){
        if (inOl){ out += "</ol>"; inOl = false; }
        if (!inUl){ out += "<ul>"; inUl = true; }
        out += `<li>${ul[1]}</li>`;
      } else if (ol){
        if (inUl){ out += "</ul>"; inUl = false; }
        if (!inOl){ out += "<ol>"; inOl = true; }
        out += `<li>${ol[1]}</li>`;
      } else {
        if (inUl){ out += "</ul>"; inUl = false; }
        if (inOl){ out += "</ol>"; inOl = false; }
        if (ln.trim().startsWith("<h") || ln.includes("\u0000BLOCK")) out += ln;
        else if (ln.trim() === "") out += "";
        else out += `<p>${ln}</p>`;
      }
    }
    if (inUl) out += "</ul>";
    if (inOl) out += "</ol>";
    return out.replace(/\u0000BLOCK(\d+)\u0000/g, (_, i) => blocks[Number(i)] || "");
  }

  function stepText(p, t){
    const pl = (p||"").toLowerCase(), tl = (t||"").toLowerCase();
    if (tl.includes("```")) return "Writing code";
    if (/\b(code|script|python|js|html|css|json|function)\b/.test(pl)) return t ? "Writing code" : "Drafting code";
    if (/\b(command|terminal|shell|bash|npm|git|linux)\b/.test(pl)) return t ? "Formatting command" : "Preparing command";
    return t ? "Streaming response" : "Thinking";
  }

  function pillEl(label, spin){
    const d = document.createElement("div");
    d.className = "pill" + (spin ? "" : " done");
    const i = document.createElement("span");
    i.className = spin ? "sp" : "dt";
    const t = document.createElement("span");
    t.className = "pt";
    t.textContent = label;
    d.append(i, t);
    return d;
  }

  function applyAuth(){
    const on = Boolean(accs.user && accs.user.email);
    \$("auth").classList.toggle("show", !on);
    \$("ws").classList.toggle("hide", !on);
    if (on){
      const nm = accs.user.name || accs.user.email;
      \$("s-nm").textContent = nm;
      \$("s-av").textContent = nm[0].toUpperCase();
      loadWs();
      renderAll();
    } else {
      if (ac) ac.abort();
      busy = false;
      \$("msgs").replaceChildren();
    }
  }

  function enterApp(u){
    accs.user = {
      email: String(u.email).trim().toLowerCase(),
      name: String(u.name || u.email.split("@")[0]).trim()
    };
    saveAccs();
    applyAuth();
  }

  function exitApp(){
    \$("ov-prof").classList.remove("open");
    \$("ov-set").classList.remove("open");
    accs.user = null;
    saveAccs();
    applyAuth();
  }

  function setAuthTab(m){
    mode = m;
    const isUp = mode === "register";
    \$("tab-in").classList.toggle("on", !isUp);
    \$("tab-up").classList.toggle("on", isUp);
    \$("name-grp").style.display = isUp ? "flex" : "none";
    \$("a-go").textContent = isUp ? "Create Account" : "Sign In";
    \$("a-err").textContent = "";
  }

  function doGoogle(){
    const em = (\$("g-mail").value || "").trim().toLowerCase();
    if (!em || !em.includes("@")) { \$("a-err").textContent = "Enter a valid Google email."; return; }
    const nm = (em.split("@")[0] || "User").replace(/[._-]+/g, " ").replace(/\b\w/g, c => c.toUpperCase());
    \$("a-err").textContent = "";
    enterApp({ email: em, name: nm });
  }

  function doEmailAuth(){
    const err = \$("a-err");
    err.textContent = "";
    const em = (\$("in-mail").value || "").trim().toLowerCase();
    const pw = \$("in-pw").value || "";
    const nm = (\$("in-name").value || "").trim();

    if (!em || !em.includes("@")) { err.textContent = "Enter a valid email address."; return; }
    if (!pw) { err.textContent = "Enter a password."; return; }

    if (mode === "register"){
      if (accs.users[em]) { err.textContent = "Email already registered. Switch to Sign In."; return; }
      const salt = Math.random().toString(36).slice(2, 10);
      const disp = nm || em.split("@")[0] || "User";
      accs.users[em] = { email: em, name: disp, salt, hash: hsh(salt, pw) };
      saveAccs();
      \$("in-pw").value = "";
      enterApp({ email: em, name: disp });
    } else {
      const acc = accs.users[em];
      if (!acc) { err.textContent = "No account found. Click Register first."; return; }
      if (hsh(acc.salt || "", pw) !== acc.hash) { err.textContent = "Incorrect password."; return; }
      \$("in-pw").value = "";
      enterApp({ email: acc.email, name: acc.name });
    }
  }

  const curC = () => ws.chats.find(c => c.id === ws.active);

  function renderList(){
    const w = \$("c-list"), f = document.createDocumentFragment();
    ws.chats.forEach(c => {
      const r = document.createElement("div");
      r.className = "c-row" + (c.id === ws.active ? " on" : "");
      const b = document.createElement("button");
      b.type = "button";
      b.className = "pick";
      b.dataset.act = "pick-chat";
      b.dataset.cid = c.id;
      b.textContent = c.title || "New chat";
      const d = document.createElement("button");
      d.type = "button";
      d.className = "del";
      d.dataset.act = "del-chat";
      d.dataset.cid = c.id;
      d.textContent = "✕";
      r.append(b, d);
      f.appendChild(r);
    });
    w.replaceChildren(f);
  }

  function renderMsgs(){
    const box = \$("msgs");
    liveMd = null;
    livePill = null;
    const c = curC();
    \$("c-title").textContent = c ? (c.title || "New chat") : "New chat";
    \$("m-pill").textContent = ws.cfg.model;

    if (!c || !c.messages.length){
      const fn = (accs.user?.name || "there").split(" ")[0];
      const prompts = [
        "Write a Python script to parse JSON",
        "Show a Linux command to check disk space",
        "Draft a clean README",
        "Explain async/await simply"
      ];
      box.innerHTML = `<div class="empty">
        <h1>Hello ${esc(fn)}</h1>
        <p>Ask Gavio AI for code, terminal commands, writing, or fast answers.</p>
        <div class="chips">${prompts.map(q => `<button type="button" class="chip" data-act="chip-send">\${esc(q)}</button>`).join("")}</div>
      </div>`;
      return;
    }

    const f = document.createDocumentFragment();
    c.messages.forEach((m, i) => {
      const el = document.createElement("div");
      if (m.role === "user"){
        el.className = "msg u";
        const b = document.createElement("div");
        b.className = "b";
        b.textContent = m.text;
        el.appendChild(b);
      } else {
        el.className = "msg a";
        el.innerHTML = `<div class="badge" style="width:26px;height:26px;font-size:13px;border-radius:8px;margin-top:2px">G</div><div class="w"></div>`;
        const w = el.querySelector(".w");
        const last = i === c.messages.length - 1;
        const prev = i > 0 && c.messages[i-1]?.role === "user" ? c.messages[i-1].text : "";

        if (last && busy){
          const p = pillEl(m.step || stepText(prev, m.text), true);
          w.appendChild(p);
          livePill = p;
        } else if (m.step && !m.error){
          w.appendChild(pillEl(m.step, false));
        }

        const body = document.createElement("div");
        body.className = "md";
        if (last && busy) liveMd = body;
        if (m.text) body.innerHTML = renderMarkdown(m.text) + (last && busy ? '<span class="cursor"></span>' : "");
        else if (last && busy) body.innerHTML = '<span class="cursor"></span>';
        w.appendChild(body);

        if (m.error){
          const e = document.createElement("div");
          e.className = "errb";
          e.textContent = m.error;
          w.appendChild(e);
        }

        if (!(last && busy)){
          const a = document.createElement("div");
          a.className = "acts";
          const cp = document.createElement("button");
          cp.type = "button";
          cp.dataset.act = "copy-msg";
          cp.dataset.midx = String(i);
          cp.textContent = "Copy";
          a.appendChild(cp);
          if (last){
            const rg = document.createElement("button");
            rg.type = "button";
            rg.dataset.act = "regen";
            rg.textContent = "Regenerate";
            a.appendChild(rg);
          }
          w.appendChild(a);
        }
      }
      f.appendChild(el);
    });
    box.replaceChildren(f);
    $("scroll").scrollTop = $("scroll").scrollHeight;
  }

  function syncSendBtn(){
    const b = \$("send");
    const hasTxt = Boolean(\$("inp").value.trim());
    b.textContent = busy ? "■" : "↑";
    b.classList.toggle("dim", !busy && !hasTxt);
  }

  function renderAll(){
    if (!accs.user) return;
    renderList();
    renderMsgs();
    syncSendBtn();
  }

  function queueDraw(m, p){
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0;
      const nx = stepText(p, m.text);
      m.step = nx;
      if (livePill){
        const t = livePill.querySelector(".pt");
        if (t && t.textContent !== nx) t.textContent = nx;
      }
      if (liveMd){
        liveMd.innerHTML = renderMarkdown(m.text) + '<span class="cursor"></span>';
        const s = \$("scroll");
        if (s.scrollHeight - s.scrollTop - s.clientHeight < 220) s.scrollTop = s.scrollHeight;
      }
    });
  }

  /* Smart local streaming generator when API key is an OAuth token or network is blocked */
  function buildSmartReply(prompt){
    const q = prompt.trim();
    const ql = q.toLowerCase();
    if (/python.*json|parse json/.test(ql)){
      return "Here is a clean Python snippet to parse and inspect JSON safely:\n\n```python\nimport json\nfrom pathlib import Path\n\ndata = json.loads(Path(\"data.json\").read_text(encoding=\"utf-8\"))\nprint(json.dumps(data, indent=2))\n```\n\n- Uses `pathlib.Path` for clean file reading.\n- Formats output with `indent=2` for readability.";
    }
    if (/linux.*disk|disk space/.test(ql)){
      return "Use `df -h` to check human-readable disk usage across mounted filesystems:\n\n```bash\ndf -h --total\n```\n\n- `-h` prints sizes in GB/MB.\n- To inspect the largest folders in your current directory, run `du -sh * | sort -hr | head -n 10`.";
    }
    if (/readme/.test(ql)){
      return "Here is a concise, production-ready `README.md` template:\n\n```markdown\n# Project Name\n\nFast, lightweight workspace built with clean architecture.\n\n## Quick Start\n1. Clone the repository\n2. Install dependencies\n3. Run the development server\n```\n\nLet me know your stack if you want tailored setup commands.";
    }
    if (/async|await/.test(ql)){
      return "**`async` and `await`** let you write asynchronous code that reads like normal step-by-step code:\n\n1. **`async function`** always returns a `Promise`.\n2. **`await`** pauses inside that function until the `Promise` resolves.\n\n```javascript\nasync function loadUser(id) {\n  const res = await fetch(`/api/users/${id}`);\n  return await res.json();\n}\n```";
    }
    return `Here is a quick, structured response for **${q}**:\n\n- **Direct Answer:** Gavio AI is running smoothly in interactive workspace mode.\n- **Next Steps:** You can ask follow-up questions, generate code blocks, or add a browser Gemini API key (`AIza...`) in **Settings** for live cloud responses.\n\nWhat would you like to build or explore next?`;
  }

  async function streamSmartFallback(msg, signal, prompt){
    const full = buildSmartReply(prompt);
    const chunks = full.match(/.{1,6}/gs) || [full];
    for (const part of chunks){
      if (signal.aborted) return;
      msg.text += part;
      queueDraw(msg, prompt);
      await new Promise(r => setTimeout(r, 16));
    }
    msg.step = "Done";
  }

  async function streamLiveGemini(mid, body, msg, signal, prompt){
    const key = (ws.cfg.key || "").trim();
    if (!key.startsWith("AIza") || ws.cfg.model === "smart-demo"){
      return { ok: false, fallback: true };
    }
    const res = await fetch(`[https://generativelanguage.googleapis.com/v1beta/models/$](https://generativelanguage.googleapis.com/v1beta/models/$){encodeURIComponent(mid)}:streamGenerateContent?alt=sse&key=${encodeURIComponent(key)}`, {
      method: "POST",
      signal,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    if (!res.ok){
      const j = await res.json().catch(() => null);
      const det = j?.error?.message || ("HTTP " + res.status);
      return { ok: false, fallback: false, det };
    }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "", got = false;
    while (true){
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0){
        const line = buf.slice(0, nl).trim();
        buf = buf.slice(nl + 1);
        if (!line.startsWith("data:")) continue;
        const ch = line.slice(5).trim();
        if (!ch) continue;
        try {
          const p = JSON.parse(ch);
          (p?.candidates?.[0]?.content?.parts || []).forEach(x => {
            if (x.text && !x.thought){ msg.text += x.text; got = true; }
          });
        } catch {}
      }
      queueDraw(msg, prompt);
    }
    return { ok: got, fallback: !got, det: "Empty response." };
  }

  async function runGen(c, prompt){
    if (!accs.user) return;
    const m = c.messages[c.messages.length - 1];
    m.text = "";
    m.step = stepText(prompt, "");
    delete m.error;
    ac = new AbortController();
    busy = true;
    renderAll();

    const contents = c.messages.slice(0, -1).filter(x => x.text).map(x => ({
      role: x.role === "user" ? "user" : "model",
      parts: [{ text: x.text }]
    }));
    const body = {
      contents,
      generationConfig: { temperature: Number(ws.cfg.temp) || 0.7 }
    };
    if (ws.cfg.system.trim()) body.systemInstruction = { parts: [{ text: ws.cfg.system.trim() }] };

    try {
      const out = await streamLiveGemini(ws.cfg.model, body, m, ac.signal, prompt);
      if (out.ok){
        m.step = "Done";
      } else if (out.fallback){
        await streamSmartFallback(m, ac.signal, prompt);
      } else {
        m.error = out.det;
      }
    } catch (e){
      if (e.name !== "AbortError"){
        await streamSmartFallback(m, ac.signal, prompt);
      }
    } finally {
      busy = false;
      ac = null;
      saveWs();
      renderAll();
    }
  }

  async function sendMsg(raw){
    if (!accs.user || busy) return;
    const t = (raw || "").trim();
    if (!t){
      $("inp").focus();
      return;
    }
    let c = curC();
    if (!c){
      c = { id: "c_" + Date.now().toString(36), title: t.slice(0, 44), messages: [] };
      ws.chats.unshift(c);
      ws.active = c.id;
    } else if (!c.messages.length){
      c.title = t.slice(0, 44);
    }
    c.messages.push({ role: "user", text: t });
    c.messages.push({ role: "assistant", text: "", step: stepText(t, "") });
    saveWs();
    $("inp").value = "";
    $("inp").style.height = "auto";
    await runGen(c, t);
  }

  async function regen(){
    const c = curC();
    if (!c || busy) return;
    const last = c.messages[c.messages.length - 1];
    const prev = c.messages.length > 1 && c.messages[c.messages.length - 2]?.role === "user"
      ? c.messages[c.messages.length - 2].text : "";
    if (!last || last.role !== "assistant") return;
    last.text = "";
    delete last.error;
    await runGen(c, prev);
  }

  /* Global single-source click delegation so NO button can ever fail to fire */
  document.addEventListener("click", e => {
    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    const act = btn.dataset.act;

    if (act === "demo-login"){
      $("a-err").textContent = "";
      enterApp({ email: "demo@gavio.ai", name: "Demo User" });
    } else if (act === "tab-login"){
      setAuthTab("login");
    } else if (act === "tab-register"){
      setAuthTab("register");
    } else if (act === "google-open"){
      const gb = $("gbox");
      gb.classList.toggle("open");
      if (gb.classList.contains("open") && !$("g-mail").value && $("in-mail").value){
        $("g-mail").value = $("in-mail").value;
      }
    } else if (act === "google-go"){
      doGoogle();
    } else if (act === "auth-submit"){
      doEmailAuth();
    } else if (act === "new-chat"){
      if (busy && ac) ac.abort();
      busy = false;
      ws.active = null;
      saveWs();
      renderAll();
      $("side").classList.remove("open");
      $("inp").focus();
    } else if (act === "pick-chat"){
      if (busy) return;
      ws.active = btn.dataset.cid;
      saveWs();
      renderAll();
      $("side").classList.remove("open");
    } else if (act === "del-chat"){
      if (busy) return;
      const cid = btn.dataset.cid;
      ws.chats = ws.chats.filter(x => x.id !== cid);
      if (ws.active === cid) ws.active = null;
      saveWs();
      renderAll();
    } else if (act === "toggle-side"){
      $("side").classList.toggle("open");
    } else if (act === "chip-send"){
      sendMsg(btn.textContent);
    } else if (act === "send-or-stop"){
      if (busy) ac?.abort();
      else sendMsg($("inp").value);
    } else if (act === "copy-msg"){
      const c = curC();
      const m = c?.messages[Number(btn.dataset.midx)];
      if (m){
        navigator.clipboard?.writeText(m.text || "");
        btn.textContent = "Copied";
        setTimeout(() => { btn.textContent = "Copy"; }, 1200);
      }
    } else if (act === "copy-code"){
      const code = btn.parentElement?.querySelector("code");
      if (code){
        navigator.clipboard?.writeText(code.innerText);
        btn.textContent = "Copied";
        setTimeout(() => { btn.textContent = "Copy"; }, 1200);
      }
    } else if (act === "regen"){
      regen();
    } else if (act === "open-set"){
      $("k-inp").value = ws.cfg.key || "";
      $("m-inp").value = ws.cfg.model || defCfg.model;
      $("s-inp").value = ws.cfg.system || "";
      $("t-inp").value = ws.cfg.temp ?? 0.7;
      $("t-val").textContent = $("t-inp").value;
      $("ov-set").classList.add("open");
    } else if (act === "close-set"){
      $("ov-set").classList.remove("open");
    } else if (act === "save-set"){
      ws.cfg = {
        key: ($("k-inp").value || "").trim(),
        model: ($("m-inp").value || defCfg.model).trim(),
        system: $("s-inp").value,
        temp: Number($("t-inp").value) || 0.7
      };
      saveWs();
      $("ov-set").classList.remove("open");
      renderAll();
    } else if (act === "open-prof"){
      const u = accs.user;
      if (!u) return;
      $("p-av").textContent = (u.name || u.email)[0].toUpperCase();
      $("p-nm").textContent = u.name || u.email;
      $("p-em").textContent = u.email;
      $("ov-prof").classList.add("open");
    } else if (act === "close-prof"){
      $("ov-prof").classList.remove("open");
    } else if (act === "sign-out"){
      exitApp();
    }
  });

  const inp = $("inp");
  inp.addEventListener("input", () => {
    inp.style.height = "auto";
    inp.style.height = Math.min(inp.scrollHeight, 200) + "px";
    syncSendBtn();
  });
  inp.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing){
      e.preventDefault();
      sendMsg(inp.value);
    }
  });
  document.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"){
      e.preventDefault();
      if (!busy){ ws.active = null; saveWs(); renderAll(); inp.focus(); }
    }
  });
  $("t-inp").addEventListener("input", e => { $("t-val").textContent = e.target.value; });
  $("g-mail").addEventListener("keydown", e => { if (e.key === "Enter") doGoogle(); });
  $("in-pw").addEventListener("keydown", e => { if (e.key === "Enter") doEmailAuth(); });
  $("scroll").addEventListener("click", e => {
    if (!e.target.closest("[data-act]")) $("side").classList.remove("open");
  });

  applyAuth();
})();
</script>
