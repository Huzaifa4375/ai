<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gavio AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<style>
:root{
  --bg:#07090e;
  --surface:#0e121b;
  --surface-2:#151b28;
  --rail:#05070b;
  --border:#1e2638;
  --text:#f1f5f9;
  --muted:#8b95a5;
  --accent:#10b981;
  --accent-2:#34d399;
  --accent-ink:#04130e;
  --violet:#8b5cf6;
  --user:#161e2e;
  --code:#05070b;
  --err:#fb7185;
  --err-bg:#2a0e16;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);
  color:var(--text);
  font:15px/1.6 "Plus Jakarta Sans",system-ui,-apple-system,sans-serif;
  display:flex;
  overflow:hidden;
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;transition:background .15s ease,border-color .15s ease,color .15s ease,opacity .15s ease}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:999px}

/* Auth Overlay */
#gate{
  position:fixed;inset:0;z-index:99999;
  background:
    radial-gradient(600px 300px at 50% -5%, rgba(16,185,129,.16), transparent),
    radial-gradient(500px 260px at 80% 10%, rgba(139,92,246,.12), transparent),
    var(--bg);
  display:flex;align-items:center;justify-content:center;padding:18px;overflow-y:auto;
}
#gate.gone{display:none !important;pointer-events:none !important}

.card{
  width:min(410px,100%);
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  padding:24px;
  box-shadow:0 24px 64px rgba(0,0,0,.7);
  display:flex;flex-direction:column;gap:14px;
  margin:auto;
}
.head-brand{display:flex;align-items:center;gap:11px}
.orb{
  width:34px;height:34px;border-radius:11px;
  background:linear-gradient(135deg,var(--accent),var(--violet));
  display:grid;place-items:center;font-family:"Outfit",sans-serif;
  font-weight:700;font-size:17px;color:#fff;flex-shrink:0;
}
.head-brand h1{margin:0;font-family:"Outfit",sans-serif;font-size:23px;font-weight:700;letter-spacing:-.02em}
.sub{margin:0;color:var(--muted);font-size:13.5px}

.mode-bar{
  display:grid;grid-template-columns:1fr 1fr;gap:4px;
  background:var(--bg);padding:4px;border-radius:12px;border:1px solid var(--border);
}
.mode-btn{
  border:0;background:transparent;padding:8px 10px;border-radius:9px;
  font-weight:600;font-size:13.5px;color:var(--muted);
}
.mode-btn.active{background:var(--surface-2);color:var(--text)}

.google-btn{
  width:100%;padding:10px 14px;border-radius:12px;
  border:1px solid var(--border);background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;gap:10px;
  font-weight:500;font-size:14px;
}
.google-btn:hover{border-color:var(--accent-2);background:#1b2334}

.google-panel{
  display:none;flex-direction:column;gap:8px;
  padding:11px;border-radius:12px;background:var(--bg);border:1px solid var(--border);
}
.google-panel.open{display:flex}
.google-panel small{color:var(--muted);font-size:12px}

.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}

.inp-group{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--muted)}
.inp-group input{
  border:1px solid var(--border);background:var(--bg);border-radius:11px;
  padding:10px 12px;font-size:14px;font-weight:400;width:100%;
}
.inp-group input:focus{border-color:var(--accent-2);outline:none}

.go-btn{
  width:100%;padding:11px 14px;border-radius:12px;border:0;
  background:var(--accent);color:var(--accent-ink);
  font-weight:700;font-size:14px;
}
.go-btn:hover{background:var(--accent-2)}

.feedback{min-height:18px;font-size:13px;color:var(--err)}

/* Main App */
#shell{display:flex;width:100%;height:100%}
#shell.hidden{display:none}

#rail{
  width:264px;background:var(--rail);border-right:1px solid var(--border);
  display:flex;flex-direction:column;flex-shrink:0;transition:transform .2s ease;
}
.rail-top{padding:15px 14px 8px;display:flex;align-items:center;gap:10px}
.rail-top span{font-family:"Outfit",sans-serif;font-weight:700;font-size:18px}

#new-btn{
  margin:8px 12px 10px;padding:9px 12px;border-radius:11px;
  border:1px solid var(--border);background:var(--surface);
  display:flex;align-items:center;justify-content:space-between;font-size:13.5px;font-weight:500;
}
#new-btn:hover{border-color:var(--accent-2)}
#new-btn kbd{font:11px "JetBrains Mono",monospace;color:var(--muted);background:var(--bg);padding:2px 6px;border-radius:5px;border:1px solid var(--border)}

#threads{flex:1;overflow-y:auto;padding:0 8px}
.t-row{display:flex;align-items:center;gap:4px;border-radius:10px;padding:0 4px 0 10px;margin-bottom:2px}
.t-row:hover,.t-row.on{background:var(--surface-2)}
.t-row .pick{flex:1;min-width:0;padding:8px 0;border:0;background:none;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.t-row .rm{border:0;background:none;color:var(--muted);padding:4px 7px;border-radius:7px;opacity:0;font-size:12px}
.t-row:hover .rm,.t-row .rm:focus-visible{opacity:1}
.t-row .rm:hover{color:var(--err);background:var(--err-bg)}

.rail-foot{padding:10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:3px}
.rail-foot button{
  width:100%;padding:8px 10px;border-radius:10px;border:0;background:none;
  display:flex;align-items:center;gap:10px;text-align:left;color:var(--muted);font-size:13.5px;
}
.rail-foot button:hover{background:var(--surface);color:var(--text)}
.chip-av{
  width:24px;height:24px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--violet));
  color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0;
}
.who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);font-weight:500}

.work{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.topbar{
  display:flex;align-items:center;gap:10px;padding:11px 18px;
  border-bottom:1px solid var(--border);background:var(--surface);
}
#burger{display:none;border:1px solid var(--border);background:var(--surface-2);border-radius:8px;padding:5px 10px}
#active-title{font-weight:600;font-size:14.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#model-tag{
  font:12px "JetBrains Mono",monospace;color:var(--accent-2);
  background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3);
  border-radius:999px;padding:3px 11px;
}

#feed-wrap{flex:1;overflow-y:auto}
.container{max-width:760px;margin:0 auto;padding:26px 20px 14px}

.welcome{padding-top:11vh}
.welcome h1{margin:0 0 8px;font-family:"Outfit",sans-serif;font-size:clamp(28px,4.5vw,38px);letter-spacing:-.025em}
.welcome p{margin:0 0 22px;color:var(--muted);max-width:48ch}
.starters{display:flex;flex-wrap:wrap;gap:8px}
.s-btn{
  border:1px solid var(--border);background:var(--surface);border-radius:12px;
  padding:9px 14px;font-size:13.5px;
}
.s-btn:hover{border-color:var(--accent-2);background:var(--surface-2)}

.turn{margin:0 0 22px}
.turn.u{display:flex;justify-content:flex-end}
.turn.u .bubble{
  background:var(--user);border:1px solid var(--border);
  padding:10px 15px;border-radius:16px 16px 4px 16px;max-width:82%;
  white-space:pre-wrap;word-wrap:break-word;font-size:14.5px;
}
.turn.a{display:flex;gap:12px;align-items:flex-start}
.turn.a .col-r{min-width:0;flex:1}

.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md p,.md ul,.md ol,.md pre,.md table,.md blockquote{margin:0 0 12px}
.md h1,.md h2,.md h3{font-family:"Outfit",sans-serif;line-height:1.25;margin:18px 0 8px}
.md a{color:var(--accent-2)}
.md blockquote{border-left:3px solid var(--accent);padding-left:13px;color:var(--muted)}
.md table{border-collapse:collapse;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--border);padding:6px 12px;text-align:left}
.md code{font:13px "JetBrains Mono",monospace;background:var(--surface-2);padding:2px 6px;border-radius:5px}
.md pre{position:relative;background:var(--code);border-radius:12px;overflow:hidden;border:1px solid var(--border)}
.md pre code{display:block;background:none;padding:15px;overflow-x:auto;color:#e2e8f0;line-height:1.55}
.cp-btn{
  position:absolute;top:8px;right:8px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--muted);border-radius:7px;padding:3px 9px;font-size:12px;
}
.cp-btn:hover{color:var(--text);border-color:var(--accent-2)}
.row-acts{display:flex;gap:4px;margin-top:6px}
.row-acts button{border:0;background:none;color:var(--muted);padding:3px 8px;border-radius:6px;font-size:12.5px}
.row-acts button:hover{background:var(--surface-2);color:var(--text)}

.status-badge{
  display:inline-flex;align-items:center;gap:8px;
  padding:5px 11px;border-radius:999px;
  background:var(--surface);border:1px solid var(--border);
  font:12px "JetBrains Mono",monospace;color:var(--muted);margin-bottom:9px;
}
.status-badge.done{opacity:.72}
.ring{
  width:11px;height:11px;border-radius:50%;
  border:2px solid var(--border);border-top-color:var(--accent-2);
  animation:spin .7s linear infinite;
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
@keyframes spin{to{transform:rotate(360deg)}}

.err-banner{background:var(--err-bg);color:var(--err);padding:10px 14px;border-radius:11px;margin-top:8px;font-size:13.5px;white-space:pre-wrap}

.dock{padding:0 20px 18px;background:var(--bg)}
.dock-box{
  max-width:760px;margin:0 auto;background:var(--surface);border:1px solid var(--border);
  border-radius:16px;display:flex;align-items:flex-end;gap:8px;padding:8px 8px 8px 16px;
}
.dock-box:focus-within{border-color:var(--accent-2)}
#prompt{flex:1;border:0;background:none;color:inherit;font:inherit;resize:none;max-height:200px;padding:6px 0;outline:none}
#go{
  border:0;background:var(--accent);color:var(--accent-ink);border-radius:11px;
  width:36px;height:36px;font-size:17px;flex-shrink:0;font-weight:700;
}
#go:hover:not(:disabled){background:var(--accent-2)}
#go:disabled{opacity:.35;cursor:default}
.caption{text-align:center;color:var(--muted);font-size:12px;margin-top:7px}

dialog{
  border:1px solid var(--border);border-radius:18px;background:var(--surface);
  color:var(--text);padding:0;width:min(430px,92vw);box-shadow:0 24px 60px rgba(0,0,0,.7);
}
dialog::backdrop{background:rgba(0,0,0,.72)}
.modal-body{padding:22px;display:flex;flex-direction:column;gap:14px}
dialog h2{margin:0;font-family:"Outfit",sans-serif;font-size:18px;display:flex;justify-content:space-between;align-items:center}
dialog label{display:flex;flex-direction:column;gap:5px;font-size:13.5px;font-weight:500}
dialog small{color:var(--muted);font-weight:400;font-size:12px}
dialog input,dialog textarea{border:1px solid var(--border);background:var(--bg);color:inherit;border-radius:10px;padding:9px 11px;font:inherit;width:100%}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:4px}
.b-ghost{border:1px solid var(--border);background:var(--surface-2);border-radius:10px;padding:8px 14px;font-size:13.5px;font-weight:500}
.b-solid{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:8px 16px;font-size:13.5px;font-weight:700}

@media (max-width:760px){
  #rail{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%)}
  #rail.open{transform:none}
  #burger{display:block}
  #model-tag,#new-btn kbd{display:none}
}
</style>
</head>
<body>

<section id="gate" aria-label="Gavio AI Sign In">
  <div class="card">
    <div class="head-brand">
      <div class="orb">G</div>
      <h1>Gavio AI</h1>
    </div>
    <p class="sub">Sign in or register to open Gavio AI.</p>

    <div class="mode-bar">
      <button type="button" class="mode-btn active" id="mode-login">Sign In</button>
      <button type="button" class="mode-btn" id="mode-register">Register</button>
    </div>

    <button type="button" class="google-btn" id="google-trigger">
      <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.7 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.6c-.3 1.5-1.1 2.8-2.4 3.6v3h3.9c2.3-2.1 3.6-5.2 3.6-8.8z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-3l-3.9-3c-1.1.7-2.5 1.2-4.1 1.2-3.2 0-5.9-2.1-6.8-5H1.2v3.1C3.2 21.3 7.3 24 12 24z"/><path fill="#FBBC05" d="M5.2 14.2c-.2-.7-.4-1.5-.4-2.2s.2-1.5.4-2.2V6.7H1.2C.4 8.3 0 10.1 0 12s.4 3.7 1.2 5.3l4-3.1z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4C17.9 1.2 15.2 0 12 0 7.3 0 3.2 2.7 1.2 6.7l4 3.1c.9-2.9 3.6-5 6.8-5z"/></svg>
      Continue with Google
    </button>

    <div class="google-panel" id="google-panel">
      <small>Enter your Google email:</small>
      <div style="display:flex;gap:8px">
        <input id="google-email" type="email" placeholder="you@gmail.com" style="flex:1;border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:8px 10px">
        <button type="button" class="b-solid" id="google-ok">Go</button>
      </div>
    </div>

    <div class="divider">or continue with email</div>

    <div id="reg-name-box" class="inp-group" style="display:none">
      <label for="f-name">Full Name</label>
      <input id="f-name" type="text" placeholder="Your name">
    </div>

    <div class="inp-group">
      <label for="f-email">Email</label>
      <input id="f-email" type="email" placeholder="you@example.com">
    </div>

    <div class="inp-group">
      <label for="f-pass">Password</label>
      <input id="f-pass" type="password" placeholder="Enter password">
    </div>

    <div class="feedback" id="f-err"></div>

    <button type="button" class="go-btn" id="auth-go">Sign In</button>
  </div>
</section>

<div id="shell" class="hidden">
  <aside id="rail">
    <div class="rail-top">
      <div class="orb" style="width:28px;height:28px;font-size:14px;border-radius:9px">G</div>
      <span>Gavio AI</span>
    </div>
    <button type="button" id="new-btn"><span>New chat</span><kbd>Ctrl K</kbd></button>
    <div id="threads"></div>
    <div class="rail-foot">
      <button type="button" id="btn-prof">
        <span class="chip-av" id="r-av">G</span>
        <span class="who" id="r-who">User</span>
      </button>
      <button type="button" id="btn-set">⚙ Settings &amp; API Key</button>
      <button type="button" id="btn-out" style="color:var(--err)">↪ Sign out</button>
    </div>
  </aside>

  <div class="work">
    <header class="topbar">
      <button type="button" id="burger" aria-label="Menu">☰</button>
      <div id="active-title">New chat</div>
      <button type="button" id="model-tag"></button>
    </header>
    <div id="feed-wrap"><div class="container" id="feed"></div></div>
    <div class="dock">
      <div class="dock-box">
        <textarea id="prompt" rows="1" placeholder="Message Gavio AI…"></textarea>
        <button type="button" id="go" aria-label="Send">↑</button>
      </div>
      <div class="caption">Enter to send · Shift+Enter for new line</div>
    </div>
  </div>
</div>

<dialog id="dlg-set">
  <form method="dialog" class="modal-body" id="form-set">
    <h2>Settings</h2>
    <label>Gemini API Key
      <input id="set-k" type="password" autocomplete="off">
      <small>Pre-configured with your key.</small>
    </label>
    <label>Model
      <input id="set-m" list="m-opts">
      <datalist id="m-opts">
        <option value="gemini-3.8-flash">
        <option value="gemini-3.5-flash-lite">
        <option value="gemini-3.1-flash-lite">
        <option value="gemini-4-hydrogen">
      </datalist>
    </label>
    <label>System Prompt
      <textarea id="set-s" rows="3" placeholder="Optional system instructions…"></textarea>
    </label>
    <label>Temperature <small id="set-tv"></small>
      <input id="set-t" type="range" min="0" max="2" step="0.1">
    </label>
    <div class="modal-actions">
      <button type="button" class="b-ghost" id="set-x">Cancel</button>
      <button type="submit" class="b-solid">Save</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-prof">
  <div class="modal-body">
    <h2><span>Profile</span><button type="button" class="b-ghost" style="padding:3px 9px" id="prof-x">✕</button></h2>
    <div style="display:flex;align-items:center;gap:12px">
      <div class="chip-av" id="p-av" style="width:42px;height:42px;font-size:17px"></div>
      <div>
        <div id="p-name" style="font-weight:600"></div>
        <div id="p-email" style="color:var(--muted);font-size:13px"></div>
      </div>
    </div>
    <div class="modal-actions">
      <button type="button" class="b-ghost" id="prof-out" style="color:var(--err);border-color:var(--err)">Sign out</button>
    </div>
  </div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" defer></script>
<script>
const API_KEY = "AQ.Ab8RN6JAgW2dzmZXOrCuNl_QrCsZlJKZNaIeG_RLh8_wylLP5A";
const MODEL_CHAIN = ["gemini-3.8-flash", "gemini-3.5-flash-lite", "gemini-3.1-flash-lite", "gemini-4-hydrogen"];

const \$ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c]));

/* Memory + localStorage dual store */
const ram = {};
function getItem(k) {
  try {
    const v = window.localStorage.getItem(k);
    if (v !== null) return v;
  } catch {}
  return Object.prototype.hasOwnProperty.call(ram, k) ? ram[k] : null;
}
function setItem(k, v) {
  ram[k] = String(v);
  try { window.localStorage.setItem(k, String(v)); } catch {}
}

function digest(salt, pw) {
  const str = salt + "|" + pw;
  let h1 = 2166136261, h2 = 3735928559;
  for (let i = 0; i < str.length; i++) {
    const c = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 16777619) >>> 0;
    h2 = Math.imul(h2 ^ (c + i), 2246822519) >>> 0;
  }
  return h1.toString(16).padStart(8, "0") + h2.toString(16).padStart(8, "0");
}

let store = { accounts: {}, user: null };
try {
  const saved = JSON.parse(getItem("gavio_users_v1") || "null");
  if (saved && typeof saved === "object") {
    store.accounts = saved.accounts && typeof saved.accounts === "object" ? saved.accounts : {};
    store.user = saved.user || null;
  }
} catch {}

function saveAccounts() {
  setItem("gavio_users_v1", JSON.stringify(store));
}

const defaultCfg = { key: API_KEY, model: "gemini-3.8-flash", system: "", temp: 0.7 };
let data = { chats: [], active: null, cfg: { ...defaultCfg } };

function dataKey() {
  return store.user ? "gavio_data_" + encodeURIComponent(store.user.email) : null;
}

function loadUserData() {
  const k = dataKey();
  if (!k) { data = { chats: [], active: null, cfg: { ...defaultCfg } }; return; }
  try {
    const raw = JSON.parse(getItem(k) || "null");
    if (raw && typeof raw === "object") {
      data.chats = Array.isArray(raw.chats) ? raw.chats : [];
      data.active = typeof raw.active === "string" ? raw.active : null;
      data.cfg = Object.assign({}, defaultCfg, raw.cfg || {});
      if (!data.cfg.key) data.cfg.key = API_KEY;
    } else {
      data = { chats: [], active: null, cfg: { ...defaultCfg } };
    }
  } catch {
    data = { chats: [], active: null, cfg: { ...defaultCfg } };
  }
}

function saveUserData() {
  const k = dataKey();
  if (!k) return;
  setItem(k, JSON.stringify(data));
}

function applySession() {
  const authed = Boolean(store.user && store.user.email);
  \$("#gate").classList.toggle("gone", authed);
  \$("#shell").classList.toggle("hidden", !authed);
  if (authed) {
    \$("#r-who").textContent = store.user.name || store.user.email;
    \$("#r-av").textContent = (store.user.name || store.user.email)[0].toUpperCase();
    loadUserData();
    drawAll();
  } else {
    if (ac) ac.abort();
    busy = false;
    \$("#feed").replaceChildren();
  }
}

function signInUser(u) {
  store.user = {
    email: String(u.email).trim().toLowerCase(),
    name: String(u.name || u.email.split("@")[0]).trim()
  };
  saveAccounts();
  applySession();
}

function signOutUser() {
  if ($("#dlg-prof").open) $("#dlg-prof").close();
  if ($("#dlg-set").open) $("#dlg-set").close();
  store.user = null;
  saveAccounts();
  applySession();
}

/* Auth Click Handlers */
let authTab = "login";
function switchTab(next) {
  authTab = next === "register" ? "register" : "login";
  const reg = authTab === "register";
  \$("#mode-login").classList.toggle("active", !reg);
  \$("#mode-register").classList.toggle("active", reg);
  \$("#reg-name-box").style.display = reg ? "flex" : "none";
  \$("#auth-go").textContent = reg ? "Create Account" : "Sign In";
  \$("#f-err").textContent = "";
}

\$("#mode-login").addEventListener("click", () => switchTab("login"));
\$("#mode-register").addEventListener("click", () => switchTab("register"));

\$("#google-trigger").addEventListener("click", () => {
  const p = \$("#google-panel");
  p.classList.toggle("open");
  if (p.classList.contains("open")) {
    if (!$("#google-email").value && $("#f-email").value) {
      $("#google-email").value = $("#f-email").value;
    }
    \$("#google-email").focus();
  }
});

function completeGoogle() {
  const email = (\$("#google-email").value || "").trim().toLowerCase();
  if (!email || !email.includes("@")) {
    \$("#f-err").textContent = "Enter a valid Google email.";
    return;
  }
  const name = email.split("@")[0].replace(/[._-]+/g, " ").replace(/\b\w/g, c => c.toUpperCase()) || "User";
  \$("#f-err").textContent = "";
  signInUser({ email, name });
}

\$("#google-ok").addEventListener("click", completeGoogle);
\$("#google-email").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); completeGoogle(); }
});

function handleAuthSubmit() {
  const err = \$("#f-err");
  err.textContent = "";
  const email = (\$("#f-email").value || "").trim().toLowerCase();
  const pass = \$("#f-pass").value || "";
  const name = (\$("#f-name").value || "").trim();

  if (!email || !email.includes("@") || !email.includes(".")) {
    err.textContent = "Please enter a valid email address.";
    return;
  }
  if (!pass) {
    err.textContent = "Please enter a password.";
    return;
  }

  if (authTab === "register") {
    if (store.accounts[email]) {
      err.textContent = "Account already exists. Click Sign In.";
      return;
    }
    const salt = Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
    const hash = digest(salt, pass);
    const displayName = name || email.split("@")[0];
    store.accounts[email] = { email, name: displayName, salt, hash };
    saveAccounts();
    \$("#f-pass").value = "";
    signInUser({ email, name: displayName });
  } else {
    const acc = store.accounts[email];
    if (!acc) {
      err.textContent = "No account found. Click Register first.";
      return;
    }
    if (digest(acc.salt || "", pass) !== acc.hash) {
      err.textContent = "Wrong password.";
      return;
    }
    \$("#f-pass").value = "";
    signInUser({ email: acc.email, name: acc.name });
  }
}

\$("#auth-go").addEventListener("click", handleAuthSubmit);
\$("#f-pass").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); handleAuthSubmit(); }
});

/* Chat & Streaming */
let busy = false, ac = null, liveBody = null, livePill = null, rafId = 0;
const curChat = () => data.chats.find(c => c.id === data.active);

function stepName(prompt, text) {
  const p = (prompt || "").toLowerCase();
  const t = (text || "").toLowerCase();
  if (t.includes("```")) return "Writing code";
  if (/\b(file|script|code|function|html|css|js|ts|python|json)\b/.test(p)) return text ? "Writing code" : "Drafting code";
  if (/\b(run|command|terminal|shell|cmd|bash|npm|git|linux)\b/.test(p)) return text ? "Formatting output" : "Running command";
  return text ? "Responding" : "Thinking";
}

function mdHtml(s) {
  if (window.marked && window.DOMPurify) {
    return DOMPurify.sanitize(marked.parse(String(s || ""), { gfm: true, breaks: true }), { ADD_ATTR: ["target"] });
  }
  return esc(s).replace(/\n/g, "<br>");
}

function enhanceCode(el) {
  el.querySelectorAll("a").forEach(a => { a.target = "_blank"; a.rel = "noopener noreferrer"; });
  el.querySelectorAll("pre").forEach(pre => {
    if (pre.dataset.ready) return;
    pre.dataset.ready = "1";
    const code = pre.querySelector("code");
    if (code && window.hljs) { try { hljs.highlightElement(code); } catch {} }
    const b = document.createElement("button");
    b.type = "button";
    b.className = "cp-btn";
    b.textContent = "Copy";
    b.onclick = () => {
      navigator.clipboard?.writeText(code ? code.innerText : pre.innerText);
      b.textContent = "Copied";
      setTimeout(() => { b.textContent = "Copy"; }, 1200);
    };
    pre.appendChild(b);
  });
}

function pillNode(label, spin) {
  const d = document.createElement("div");
  d.className = "status-badge" + (spin ? "" : " done");
  const ic = document.createElement("span");
  ic.className = spin ? "ring" : "dot";
  const tx = document.createElement("span");
  tx.className = "s-txt";
  tx.textContent = label;
  d.append(ic, tx);
  return d;
}

function drawThreads() {
  const wrap = $("#threads");
  const frag = document.createDocumentFragment();
  data.chats.forEach(c => {
    const row = document.createElement("div");
    row.className = "t-row" + (c.id === data.active ? " on" : "");
    const b = document.createElement("button");
    b.type = "button";
    b.className = "pick";
    b.textContent = c.title || "New chat";
    b.onclick = () => {
      if (busy) return;
      data.active = c.id;
      saveUserData();
      drawAll();
      $("#rail").classList.remove("open");
    };
    const rm = document.createElement("button");
    rm.type = "button";
    rm.className = "rm";
    rm.textContent = "✕";
    rm.onclick = () => {
      if (busy) return;
      data.chats = data.chats.filter(x => x.id !== c.id);
      if (data.active === c.id) data.active = null;
      saveUserData();
      drawAll();
    };
    row.append(b, rm);
    frag.appendChild(row);
  });
  wrap.replaceChildren(frag);
}

function drawFeed() {
  const feed = $("#feed");
  liveBody = null;
  livePill = null;
  const c = curChat();
  $("#active-title").textContent = c ? (c.title || "New chat") : "New chat";
  $("#model-tag").textContent = data.cfg.model;

  if (!c || !c.messages.length) {
    const first = (store.user?.name || "there").split(" ")[0];
    feed.innerHTML = `<div class="welcome"><h1>Hey ${esc(first)}, what are we building?</h1><p>Ask Gavio AI for code, terminal commands, writing, or quick answers.</p><div class="starters"></div></div>`;
    const list = feed.querySelector(".starters");
    ["Write a Python script to clean CSV data", "Show a shell command to check memory usage", "Draft a clean API readme", "Explain async/await simply"].forEach(s => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "s-btn";
      b.textContent = s;
      b.onclick = () => ask(s);
      list.appendChild(b);
    });
    return;
  }

  const frag = document.createDocumentFragment();
  c.messages.forEach((m, i) => {
    const el = document.createElement("div");
    if (m.role === "user") {
      el.className = "turn u";
      const bub = document.createElement("div");
      bub.className = "bubble";
      bub.textContent = m.text;
      el.appendChild(bub);
    } else {
      el.className = "turn a";
      el.innerHTML = `<div class="orb" style="width:26px;height:26px;font-size:13px;border-radius:8px;margin-top:2px">G</div><div class="col-r"></div>`;
      const col = el.querySelector(".col-r");
      const last = i === c.messages.length - 1;
      const prev = i > 0 && c.messages[i - 1]?.role === "user" ? c.messages[i - 1].text : "";

      if (last && busy) {
        const pill = pillNode(m.step || stepName(prev, m.text), true);
        col.appendChild(pill);
        livePill = pill;
      } else if (m.step && !m.error) {
        col.appendChild(pillNode(m.step, false));
      }

      const mdBox = document.createElement("div");
      mdBox.className = "md";
      if (last && busy) liveBody = mdBox;
      if (m.text) {
        mdBox.innerHTML = mdHtml(m.text);
        if (!(last && busy)) enhanceCode(mdBox);
      }
      col.appendChild(mdBox);

      if (m.error) {
        const err = document.createElement("div");
        err.className = "err-banner";
        err.textContent = m.error;
        col.appendChild(err);
      }

      if (!(last && busy)) {
        const acts = document.createElement("div");
        acts.className = "row-acts";
        const cp = document.createElement("button");
        cp.type = "button";
        cp.textContent = "Copy";
        cp.onclick = () => {
          navigator.clipboard?.writeText(m.text || "");
          cp.textContent = "Copied";
          setTimeout(() => { cp.textContent = "Copy"; }, 1200);
        };
        acts.appendChild(cp);
        if (last) {
          const rg = document.createElement("button");
          rg.type = "button";
          rg.textContent = "Regenerate";
          rg.onclick = () => retryLast();
          acts.appendChild(rg);
        }
        col.appendChild(acts);
      }
    }
    frag.appendChild(el);
  });
  feed.replaceChildren(frag);
  const w = $("#feed-wrap");
  w.scrollTop = w.scrollHeight;
}

function syncSend() {
  const b = $("#go");
  b.textContent = busy ? "■" : "↑";
  b.disabled = !busy && !$("#prompt").value.trim();
}

function drawAll() {
  if (!store.user) return;
  drawThreads();
  drawFeed();
  syncSend();
}

function queueDraw(m, prompt) {
  if (rafId) return;
  rafId = requestAnimationFrame(() => {
    rafId = 0;
    const next = stepName(prompt, m.text);
    m.step = next;
    if (livePill) {
      const t = livePill.querySelector(".s-txt");
      if (t && t.textContent !== next) t.textContent = next;
    }
    if (liveBody) {
      liveBody.innerHTML = mdHtml(m.text);
      const w = $("#feed-wrap");
      if (w.scrollHeight - w.scrollTop - w.clientHeight < 180) w.scrollTop = w.scrollHeight;
    }
  });
}

async function streamOne(modelId, body, msg, signal, prompt) {
  const key = (data.cfg.key || API_KEY).trim();
  const headers = { "Content-Type": "application/json", "x-goog-api-key": key };
  if (key.startsWith("AQ.") || key.startsWith("ya29.")) {
    headers["Authorization"] = "Bearer " + key;
  }
  const res = await fetch(`[https://generativelanguage.googleapis.com/v1beta/models/$](https://generativelanguage.googleapis.com/v1beta/models/$){encodeURIComponent(modelId)}:streamGenerateContent?alt=sse`, {
    method: "POST", signal, headers, body: JSON.stringify(body)
  });

  if (!res.ok) {
    const j = await res.json().catch(() => null);
    const detail = j?.error?.message || ("Request failed (" + res.status + ")");
    const busyLoad = res.status === 503 || /high demand|overloaded|unavailable/i.test(detail);
    return { ok: false, busyLoad, detail };
  }

  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = "", got = false;

  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let nl;
    while ((nl = buf.indexOf("\n")) >= 0) {
      const line = buf.slice(0, nl).trim();
      buf = buf.slice(nl + 1);
      if (!line.startsWith("data:")) continue;
      const chunk = line.slice(5).trim();
      if (!chunk) continue;
      try {
        const parsed = JSON.parse(chunk);
        const parts = parsed?.candidates?.[0]?.content?.parts || [];
        parts.forEach(p => {
          if (p.text && !p.thought) { msg.text += p.text; got = true; }
        });
      } catch {}
    }
    queueDraw(msg, prompt);
  }
  return { ok: got, busyLoad: false, detail: "Empty response." };
}

async function runTurn(chatObj, promptText) {
  if (!store.user) return;
  const aiMsg = chatObj.messages[chatObj.messages.length - 1];
  aiMsg.text = "";
  aiMsg.step = stepName(promptText, "");
  delete aiMsg.error;

  ac = new AbortController();
  busy = true;
  drawAll();

  const preferred = (data.cfg.model || defaultCfg.model).replace(/^models\//, "");
  const order = Array.from(new Set([preferred, ...MODEL_CHAIN]));
  const contents = chatObj.messages.slice(0, -1).filter(m => m.text).map(m => ({
    role: m.role === "user" ? "user" : "model",
    parts: [{ text: m.text }]
  }));
  const body = { contents, generationConfig: { temperature: Number(data.cfg.temp) || 0.7 } };
  if (data.cfg.system.trim()) body.systemInstruction = { parts: [{ text: data.cfg.system.trim() }] };

  try {
    let doneOk = false;
    for (const mId of order) {
      for (let t = 0; t < 2; t++) {
        aiMsg.text = "";
        if (mId !== preferred || t > 0) {
          aiMsg.step = "Switching capacity";
          drawFeed();
        }
        const out = await streamOne(mId, body, aiMsg, ac.signal, promptText);
        if (out.ok) {
          aiMsg.step = "Done";
          doneOk = true;
          break;
        }
        if (out.busyLoad) {
          await new Promise(r => setTimeout(r, 250));
          continue;
        }
        aiMsg.error = out.detail;
        doneOk = true;
        break;
      }
      if (doneOk) break;
    }
    if (!doneOk && !aiMsg.text && !aiMsg.error) {
      aiMsg.error = "Models are busy right now. Try again shortly.";
    }
  } catch (err) {
    if (err.name !== "AbortError") aiMsg.error = err.message || String(err);
  } finally {
    busy = false;
    ac = null;
    saveUserData();
    drawAll();
  }
}

async function ask(raw) {
  if (!store.user || busy) return;
  const text = (raw || "").trim();
  if (!text) return;
  let c = curChat();
  if (!c) {
    c = { id: "t_" + Date.now().toString(36), title: text.slice(0, 44), messages: [] };
    data.chats.unshift(c);
    data.active = c.id;
  } else if (!c.messages.length) {
    c.title = text.slice(0, 44);
  }
  c.messages.push({ role: "user", text });
  c.messages.push({ role: "assistant", text: "", step: stepName(text, "") });
  saveUserData();
  $("#prompt").value = "";
  $("#prompt").style.height = "auto";
  await runTurn(c, text);
}

async function retryLast() {
  const c = curChat();
  if (!c || busy) return;
  const last = c.messages[c.messages.length - 1];
  const prev = c.messages.length > 1 && c.messages[c.messages.length - 2]?.role === "user"
    ? c.messages[c.messages.length - 2].text : "";
  if (!last || last.role !== "assistant") return;
  last.text = "";
  delete last.error;
  await runTurn(c, prev);
}

/* Composer & App Buttons */
const pr = $("#prompt");
pr.addEventListener("input", () => {
  pr.style.height = "auto";
  pr.style.height = Math.min(pr.scrollHeight, 200) + "px";
  syncSend();
});
pr.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(pr.value); }
});
$("#go").addEventListener("click", () => { if (busy) ac?.abort(); else ask(pr.value); });
$("#new-btn").addEventListener("click", () => {
  if (busy) return;
  data.active = null;
  saveUserData();
  drawAll();
  $("#rail").classList.remove("open");
  pr.focus();
});
document.addEventListener("keydown", e => {
  if (store.user && (e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    $("#new-btn").click();
  }
});
$("#burger").addEventListener("click", () => $("#rail").classList.toggle("open"));
$("#feed-wrap").addEventListener("click", () => $("#rail").classList.remove("open"));

$("#btn-set").addEventListener("click", () => {
  $("#set-k").value = data.cfg.key || API_KEY;
  $("#set-m").value = data.cfg.model || defaultCfg.model;
  $("#set-s").value = data.cfg.system || "";
  $("#set-t").value = data.cfg.temp ?? 0.7;
  $("#set-tv").textContent = $("#set-t").value;
  if (!$("#dlg-set").open) $("#dlg-set").showModal();
});
$("#model-tag").addEventListener("click", () => $("#btn-set").click());
$("#set-t").addEventListener("input", e => { $("#set-tv").textContent = e.target.value; });
$("#set-x").addEventListener("click", () => $("#dlg-set").close());
$("#form-set").addEventListener("submit", () => {
  data.cfg = {
    key: ($("#set-k").value || API_KEY).trim(),
    model: ($("#set-m").value || defaultCfg.model).trim(),
    system: $("#set-s").value,
    temp: Number($("#set-t").value) || 0.7
  };
  saveUserData();
  drawAll();
});

$("#btn-prof").addEventListener("click", () => {
  const u = store.user;
  if (!u) return;
  $("#p-av").textContent = (u.name || u.email)[0].toUpperCase();
  $("#p-name").textContent = u.name || u.email;
  $("#p-email").textContent = u.email;
  if (!$("#dlg-prof").open) $("#dlg-prof").showModal();
});
$("#prof-x").addEventListener("click", () => $("#dlg-prof").close());
$("#prof-out").addEventListener("click", signOutUser);
$("#btn-out").addEventListener("click", signOutUser);

applySession();
</script>
