<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gavio AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#08080a;
  --panel:#111114;
  --side:#050507;
  --line:#232329;
  --text:#f3f2ef;
  --mute:#93918b;
  --accent:#d97757;
  --accent-hover:#e58667;
  --accent-ink:#09090b;
  --user:#1b1b20;
  --code:#050507;
  --err:#fda29b;
  --errbg:#2b1111;
  --ok:#7ce3a1;
  --shadow:0 20px 50px rgba(0,0,0,.75);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);
  color:var(--text);
  font:15px/1.62 "Instrument Sans",system-ui,-apple-system,sans-serif;
  display:flex;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea{font:inherit;color:inherit}
button{
  cursor:pointer;
  transition:background-color .14s ease,border-color .14s ease,color .14s ease,opacity .14s ease;
}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:var(--mute)}

/* Auth Gate */
#auth-gate{
  position:fixed;inset:0;z-index:9999;background:var(--bg);
  display:flex;align-items:center;justify-content:center;padding:20px;
  overflow-y:auto;
}
#auth-gate.hidden{display:none;pointer-events:none}
.auth-card{
  width:min(420px,100%);background:var(--panel);border:1px solid var(--line);
  border-radius:20px;padding:26px 24px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:14px;margin:auto;
}
.auth-brand{display:flex;align-items:center;gap:10px}
.auth-brand h1{
  margin:0;font-family:"Newsreader",Georgia,serif;
  font-weight:500;font-size:26px;letter-spacing:-.02em;
}
.auth-sub{margin:0;color:var(--mute);font-size:13.5px;line-height:1.5}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);padding:4px;border-radius:11px;border:1px solid var(--line)}
.tab{border:0;background:transparent;padding:8px 10px;border-radius:8px;font-weight:500;font-size:13.5px;color:var(--mute)}
.tab.on{background:var(--panel);color:var(--text);border:1px solid var(--line)}
.div{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:12px}
.div::before,.div::after{content:"";flex:1;height:1px;background:var(--line)}
.auth-err{color:var(--err);font-size:13px;min-height:18px;line-height:1.4}
.auth-ok{color:var(--ok)}
#g-btn-wrap:empty{display:none}
.g-inline-box{
  display:none;flex-direction:column;gap:8px;padding:12px;
  border-radius:12px;background:var(--bg);border:1px solid var(--line);
}
.g-inline-box.open{display:flex}

/* App Shell */
#app{display:flex;width:100%;height:100%}
#app.locked{filter:blur(6px);pointer-events:none;user-select:none}

/* Sidebar */
#side{
  width:268px;background:var(--side);border-right:1px solid var(--line);
  display:flex;flex-direction:column;flex-shrink:0;transition:transform .2s cubic-bezier(.16,1,.3,1);
}
.brand{padding:16px 16px 10px;font-weight:600;font-size:16px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand-serif{font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:20px}
.mark{
  width:26px;height:26px;border-radius:8px;background:var(--accent);
  display:grid;place-items:center;color:var(--accent-ink);font-size:14px;font-weight:600;flex-shrink:0;
}
#newchat{
  margin:6px 12px 10px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);text-align:left;font-weight:500;font-size:14px;
  display:flex;align-items:center;justify-content:space-between;
}
#newchat:hover{border-color:var(--accent)}
#newchat kbd{font:11px "JetBrains Mono",monospace;color:var(--mute);background:var(--bg);padding:2px 6px;border-radius:5px;border:1px solid var(--line)}
#list{flex:1;overflow-y:auto;padding:2px 8px}
.item{display:flex;align-items:center;gap:4px;border-radius:9px;padding:0 4px 0 10px;margin-bottom:2px}
.item:hover,.item.on{background:var(--panel)}
.item .t{flex:1;min-width:0;padding:8px 0;border:0;background:none;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.item .x{border:0;background:none;color:var(--mute);padding:4px 7px;border-radius:6px;opacity:0;font-size:12px}
.item:hover .x,.item .x:focus-visible{opacity:1}
.item .x:hover{color:var(--err);background:var(--errbg)}

.sidefoot{padding:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.sidefoot button{
  width:100%;padding:8px 10px;border-radius:10px;border:0;background:none;
  text-align:left;color:var(--mute);display:flex;align-items:center;gap:10px;font-size:13.5px;
}
.sidefoot button:hover{background:var(--panel);color:var(--text)}
.avatar{
  width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font-size:12px;font-weight:600;object-fit:cover;flex-shrink:0;
}
.u-info{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);font-weight:500}

/* Main */
main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
header{
  display:flex;align-items:center;gap:10px;padding:11px 18px;
  border-bottom:1px solid var(--line);background:var(--bg);
}
#menu{display:none;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px}
#title{font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
#modelbadge{
  font:12px "JetBrains Mono",monospace;color:var(--mute);
  border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 11px;
}
#modelbadge:hover{border-color:var(--accent);color:var(--text)}
#scroll{flex:1;overflow-y:auto;contain:strict}
.col{max-width:740px;margin:0 auto;padding:28px 22px 16px}

.empty{padding-top:11vh}
.empty h1{
  font-family:"Newsreader",Georgia,serif;font-size:clamp(30px,4.5vw,42px);
  line-height:1.15;letter-spacing:-.02em;margin:0 0 10px;font-weight:400;
}
.empty p{color:var(--mute);margin:0 0 24px;max-width:48ch}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  border:1px solid var(--line);background:var(--panel);border-radius:999px;
  padding:8px 14px;font-size:13.5px;color:var(--text);
}
.chip:hover{border-color:var(--accent);background:var(--user)}

.msg{margin:0 0 24px}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .body{
  background:var(--user);padding:11px 16px;border-radius:18px 18px 4px 18px;
  max-width:82%;white-space:pre-wrap;word-wrap:break-word;font-size:14.5px;
}
.msg.ai{display:flex;gap:12px;align-items:flex-start}
.msg.ai .mark{margin-top:3px}
.msg.ai .wrap{min-width:0;flex:1}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md p,.md ul,.md ol,.md pre,.md table,.md blockquote{margin:0 0 13px}
.md h1,.md h2,.md h3{line-height:1.25;margin:20px 0 9px;letter-spacing:-.01em;font-weight:600}
.md h1{font-size:20px}.md h2{font-size:17.5px}.md h3{font-size:15.5px}
.md a{color:var(--accent)}
.md blockquote{border-left:3px solid var(--line);padding-left:14px;color:var(--mute)}
.md table{border-collapse:collapse;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:6px 12px;text-align:left}
.md code{font:13px "JetBrains Mono",monospace;background:var(--user);padding:2px 6px;border-radius:5px}
.md pre{position:relative;background:var(--code);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.md pre code{display:block;background:none;padding:15px;overflow-x:auto;color:#ece9e2;line-height:1.55}
.copy{
  position:absolute;top:8px;right:8px;border:1px solid #2e2e36;
  background:#151519;color:#c9c5bc;border-radius:7px;padding:3px 9px;font-size:12px;
}
.copy:hover{color:#fff;border-color:var(--accent)}
.acts{display:flex;gap:4px;margin-top:6px}
.acts button{border:0;background:none;color:var(--mute);padding:3px 8px;border-radius:6px;font-size:12.5px}
.acts button:hover{background:var(--user);color:var(--text)}

/* Claude-style Activity Pill */
.activity{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 11px;border-radius:9px;
  background:var(--panel);border:1px solid var(--line);
  font-size:12.5px;color:var(--mute);margin-bottom:10px;
  font-family:"JetBrains Mono",monospace;
}
.activity.done{opacity:.75}
.spin-ring{
  width:12px;height:12px;border-radius:50%;
  border:2px solid var(--line);border-top-color:var(--accent);
  animation:spin .7s linear infinite;flex-shrink:0;
}
.check-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex-shrink:0}
.act-label{
  background:linear-gradient(90deg,var(--mute) 0%,var(--text) 50%,var(--mute) 100%);
  background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;
  animation:shimmer 1.6s linear infinite;
}
.activity.done .act-label{background:none;-webkit-text-fill-color:var(--mute);animation:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:200% center}100%{background-position:-200% center}}
@media (prefers-reduced-motion:reduce){.spin-ring,.act-label{animation:none}}

.err{background:var(--errbg);color:var(--err);padding:10px 14px;border-radius:10px;margin-top:8px;font-size:13.5px;white-space:pre-wrap}

/* Composer */
#comp{padding:0 20px 18px;background:var(--bg)}
#box{
  max-width:740px;margin:0 auto;background:var(--panel);border:1px solid var(--line);
  border-radius:18px;display:flex;align-items:flex-end;gap:8px;padding:8px 8px 8px 16px;
  box-shadow:0 2px 10px rgba(0,0,0,.25);
}
#box:focus-within{border-color:var(--accent)}
#inp{flex:1;border:0;background:none;color:inherit;font:inherit;resize:none;max-height:200px;padding:7px 0;outline:none}
#send{
  border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;
  width:36px;height:36px;font-size:17px;flex-shrink:0;
}
#send:hover:not(:disabled){background:var(--accent-hover)}
#send:disabled{opacity:.35;cursor:default}
.hint{text-align:center;color:var(--mute);font-size:12px;margin-top:8px}

/* Dialogs */
dialog{
  border:1px solid var(--line);border-radius:18px;background:var(--panel);
  color:var(--text);padding:0;width:min(440px,92vw);box-shadow:var(--shadow);
}
dialog::backdrop{background:rgba(0,0,0,.72);backdrop-filter:blur(2px)}
.dlg-body{padding:22px;display:flex;flex-direction:column;gap:14px}
dialog h2{margin:0;font-size:18px;display:flex;justify-content:space-between;align-items:center}
dialog label{display:flex;flex-direction:column;gap:5px;font-weight:500;font-size:13.5px}
dialog small{color:var(--mute);font-weight:400;font-size:12px;line-height:1.4}
dialog input,dialog textarea{
  border:1px solid var(--line);background:var(--bg);color:inherit;
  border-radius:10px;padding:9px 11px;font:inherit;width:100%;font-size:14px;
}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:4px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 15px;font-weight:500;font-size:13.5px}
.btn:hover{border-color:var(--text);background:var(--user)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.full{width:100%;justify-content:center;display:flex;align-items:center;gap:8px;padding:10px}
dialog a{color:var(--accent)}

@media (max-width:760px){
  #side{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%)}
  #side.open{transform:none;box-shadow:var(--shadow)}
  #menu{display:block}
  #modelbadge,#newchat kbd{display:none}
}
</style>
</head>
<body>

<section id="auth-gate" aria-label="Authentication required">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="mark">✦</span>
      <h1>Gavio AI</h1>
    </div>
    <p class="auth-sub">Sign in or register an account to enter Gavio AI.</p>

    <div class="tabs" role="tablist">
      <button type="button" class="tab on" id="tab-login" role="tab" aria-selected="true" data-mode="login">Sign In</button>
      <button type="button" class="tab" id="tab-register" role="tab" aria-selected="false" data-mode="register">Register</button>
    </div>

    <div id="g-btn-wrap"></div>
    <button type="button" class="btn full" id="g-fallback">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.7 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.6c-.3 1.5-1.1 2.8-2.4 3.6v3h3.9c2.3-2.1 3.6-5.2 3.6-8.8z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-3l-3.9-3c-1.1.7-2.5 1.2-4.1 1.2-3.2 0-5.9-2.1-6.8-5H1.2v3.1C3.2 21.3 7.3 24 12 24z"/><path fill="#FBBC05" d="M5.2 14.2c-.2-.7-.4-1.5-.4-2.2s.2-1.5.4-2.2V6.7H1.2C.4 8.3 0 10.1 0 12s.4 3.7 1.2 5.3l4-3.1z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4C17.9 1.2 15.2 0 12 0 7.3 0 3.2 2.7 1.2 6.7l4 3.1c.9-2.9 3.6-5 6.8-5z"/></svg>
      Continue with Google
    </button>

    <div class="g-inline-box" id="g-inline">
      <small>Enter your Google email to sign in:</small>
      <div style="display:flex;gap:8px">
        <input id="g-email" type="email" placeholder="you@gmail.com" style="flex:1">
        <button type="button" class="btn pri" id="g-confirm">Continue</button>
      </div>
    </div>

    <div class="div">or with email &amp; password</div>

    <form id="aform" style="display:flex;flex-direction:column;gap:12px">
      <label id="a-name-wrap" style="display:none">Full Name
        <input id="a-name" type="text" autocomplete="name" maxlength="80" placeholder="Your name">
      </label>
      <label>Email
        <input id="a-email" type="email" autocomplete="email" required maxlength="160" placeholder="you@example.com">
      </label>
      <label>Password
        <input id="a-pass" type="password" autocomplete="current-password" required minlength="4" maxlength="128" placeholder="At least 4 characters">
      </label>
      <div class="auth-err" id="a-err" role="alert"></div>
      <button type="submit" class="btn pri full" id="a-submit">Sign In</button>
    </form>
  </div>
</section>

<div id="app" class="locked">
  <aside id="side">
    <div class="brand"><span class="mark">✦</span><span class="brand-serif" id="appname"></span></div>
    <button id="newchat"><span>New chat</span><kbd>Ctrl K</kbd></button>
    <div id="list"></div>
    <div class="sidefoot">
      <button id="openprofile">
        <span class="avatar" id="u-av">?</span>
        <span class="u-info" id="u-name">Account</span>
      </button>
      <button id="opensettings">⚙ Settings &amp; API Key</button>
      <button id="quick-logout" style="color:var(--err)">↪ Sign Out</button>
    </div>
  </aside>

  <main>
    <header>
      <button id="menu" aria-label="Open chats">☰</button>
      <div id="title">New chat</div>
      <button type="button" id="modelbadge" title="Click to change model"></button>
    </header>
    <div id="scroll"><div class="col" id="msgs"></div></div>
    <div id="comp">
      <div id="box">
        <textarea id="inp" rows="1" placeholder="How can Gavio AI help today?" aria-label="Message"></textarea>
        <button id="send" aria-label="Send">↑</button>
      </div>
      <div class="hint">Enter to send · Shift+Enter for a new line</div>
    </div>
  </main>
</div>

<dialog id="dlg">
  <form method="dialog" class="dlg-body" id="sform">
    <h2>Gavio AI Settings</h2>
    <label>Gemini API key
      <input id="s-key" type="password" autocomplete="off" spellcheck="false" placeholder="API key">
      <small>Pre-configured with your key. Saved per signed-in user in this browser.</small>
    </label>
    <label>Preferred Model
      <input id="s-model" list="models" placeholder="gemini-3.8-flash">
      <datalist id="models">
        <option value="gemini-3.8-flash">
        <option value="gemini-3.5-flash-lite">
        <option value="gemini-3.1-flash-lite">
        <option value="gemini-4-hydrogen">
      </datalist>
      <small>Automatically retries and falls back across models during traffic spikes.</small>
    </label>
    <label>System instructions
      <textarea id="s-sys" rows="3" maxlength="4000" placeholder="e.g. You are Gavio AI, fast, clear, and concise."></textarea>
    </label>
    <label>Temperature <small id="s-tv"></small>
      <input id="s-temp" type="range" min="0" max="2" step="0.1">
    </label>
    <div class="row">
      <button type="button" class="btn" id="s-cancel">Cancel</button>
      <button type="submit" class="btn pri">Save</button>
    </div>
  </form>
</dialog>

<dialog id="pdlg">
  <div class="dlg-body">
    <h2><span>Account Profile</span><button type="button" class="btn" style="padding:3px 9px;border:0" id="p-close">✕</button></h2>
    <div style="display:flex;align-items:center;gap:12px;padding:6px 0">
      <div class="avatar" id="p-av" style="width:44px;height:44px;font-size:18px"></div>
      <div style="min-width:0">
        <div id="p-name" style="font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis"></div>
        <div id="p-email" style="color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis"></div>
      </div>
    </div>
    <small>Chats and settings are saved under this account in this browser.</small>
    <div class="row">
      <button type="button" class="btn" id="logout-btn" style="color:var(--err);border-color:var(--err)">Sign Out</button>
    </div>
  </div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" defer></script>
<script>
const APP_NAME = "Gavio AI";
const DEFAULT_API_KEY = "AQ.Ab8RN6JAgW2dzmZXOrCuNl_QrCsZlJKZNaIeG_RLh8_wylLP5A";
const GOOGLE_CLIENT_ID = "";

const FALLBACK_CHAIN = [
  "gemini-3.8-flash",
  "gemini-3.5-flash-lite",
  "gemini-3.1-flash-lite",
  "gemini-4-hydrogen"
];

const \$ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c]));
const looksLikeEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]+\$/.test(e);
const isSafeUrl = u => {
  try {
    const parsed = new URL(u);
    return parsed.protocol === "https:" || parsed.protocol === "http:";
  } catch {
    return false;
  }
};
const sleep = (ms, signal) => new Promise((res, rej) => {
  const id = setTimeout(res, ms);
  signal?.addEventListener("abort", () => { clearTimeout(id); rej(new DOMException("Aborted", "AbortError")); }, { once: true });
});

/* --- AUTH WITH SAFE CRYPTO + COMPATIBLE FALLBACK --- */
const AUTH_KEY = "gavio_auth_v3";

function loadAuthStore() {
  try {
    const d = JSON.parse(localStorage.getItem(AUTH_KEY));
    if (d && typeof d === "object") {
      return { users: d.users && typeof d.users === "object" ? d.users : {}, current: d.current || null };
    }
  } catch {}
  return { users: {}, current: null };
}

let auth = loadAuthStore();

function saveAuthStore() {
  try { localStorage.setItem(AUTH_KEY, JSON.stringify(auth)); } catch {}
}

function randomSalt() {
  try {
    if (window.crypto && typeof window.crypto.getRandomValues === "function") {
      const arr = new Uint8Array(12);
      window.crypto.getRandomValues(arr);
      return Array.from(arr, b => b.toString(16).padStart(2, "0")).join("");
    }
  } catch {}
  return Math.random().toString(16).slice(2, 14) + Date.now().toString(16);
}

function fallbackHash(text) {
  let h1 = 0x811c9dc5;
  let h2 = 0x01000193;
  for (let i = 0; i < text.length; i++) {
    const ch = text.charCodeAt(i);
    h1 ^= ch;
    h1 = Math.imul(h1, 0x01000193);
    h2 ^= ch + i;
    h2 = Math.imul(h2, 0x85ebca6b);
  }
  return ((h1 >>> 0).toString(16).padStart(8, "0") + (h2 >>> 0).toString(16).padStart(8, "0"));
}

async function hashPassword(password, salt) {
  const payload = `${salt}:${password}`;
  try {
    if (window.crypto && window.crypto.subtle && typeof window.crypto.subtle.digest === "function" && (window.isSecureContext || location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
      const enc = new TextEncoder().encode(payload);
      const digest = await window.crypto.subtle.digest("SHA-256", enc);
      return Array.from(new Uint8Array(digest), b => b.toString(16).padStart(2, "0")).join("");
    }
  } catch {}
  return fallbackHash(payload);
}

/* --- WORKSPACE STATE --- */
const defaults = { key: DEFAULT_API_KEY, model: "gemini-3.8-flash", system: "", temp: 0.7 };
let state = { chats: [], settings: { ...defaults }, active: null };

function userStorageKey() {
  return auth.current ? "gavio_ws_" + encodeURIComponent(auth.current.email) : null;
}

function loadState() {
  const k = userStorageKey();
  if (!k) {
    state = { chats: [], settings: { ...defaults }, active: null };
    return;
  }
  try {
    const raw = JSON.parse(localStorage.getItem(k)) || {};
    state.chats = Array.isArray(raw.chats) ? raw.chats : [];
    state.active = typeof raw.active === "string" ? raw.active : null;
    state.settings = Object.assign({}, defaults, raw.settings || {});
    if (!state.settings.key) state.settings.key = DEFAULT_API_KEY;
    if (!state.settings.model || state.settings.model === "gemini-2.5-flash" || state.settings.model === "models/gemini-2.5-flash") {
      state.settings.model = "gemini-3.8-flash";
    }
  } catch {
    state = { chats: [], settings: { ...defaults }, active: null };
  }
}

let saveTimer = 0;
const save = () => {
  const k = userStorageKey();
  if (!k) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(k, JSON.stringify(state)); } catch {}
  }, 150);
};

function applyGate() {
  const signedIn = Boolean(auth.current && auth.current.email);
  \$("#auth-gate").classList.toggle("hidden", signedIn);
  \$("#app").classList.toggle("locked", !signedIn);
  if (signedIn) {
    updateUserUI();
    loadState();
    renderAll();
  } else {
    if (ctrl) ctrl.abort();
    busy = false;
    state = { chats: [], settings: { ...defaults }, active: null };
    \$("#msgs").replaceChildren();
    initGoogleAuth();
  }
}

function setSession(user) {
  if (user && user.email) {
    auth.current = {
      name: String(user.name || user.email.split("@")[0]).slice(0, 80),
      email: String(user.email).trim().toLowerCase().slice(0, 160),
      pic: user.pic && isSafeUrl(user.pic) ? user.pic : ""
    };
  } else {
    auth.current = null;
  }
  saveAuthStore();
  applyGate();
}

function updateUserUI() {
  const u = auth.current;
  if (!u) return;
  \$("#u-name").textContent = u.name || u.email;
  const av = \$("#u-av");
  av.replaceChildren();
  if (u.pic) {
    const img = document.createElement("img");
    img.src = u.pic;
    img.alt = "";
    img.className = "avatar";
    av.appendChild(img);
  } else {
    av.textContent = (u.name || u.email)[0].toUpperCase();
  }
}

/* --- ACTIVITY INFERENCE --- */
function inferActivity(promptText, streamedText) {
  const t = (promptText || "").toLowerCase();
  const s = (streamedText || "").toLowerCase();
  if (s.includes("```")) return "Writing code block";
  if (/\b(file|script|code|function|class|component|html|css|js|ts|python|bash|json|sql|yaml)\b/.test(t)) {
    return streamedText ? "Drafting file & code" : "Inspecting task & writing code";
  }
  if (/\b(run|command|terminal|cli|cmd|shell|deploy|build|test|install|npm|git|docker|linux)\b/.test(t)) {
    return streamedText ? "Preparing command output" : "Running command";
  }
  if (/\b(search|find|check|compare|analyze|explain|why|how|review|debug|fix)\b/.test(t)) {
    return streamedText ? "Synthesizing answer" : "Analyzing request";
  }
  return streamedText ? "Composing response" : "Thinking";
}

/* --- MARKDOWN & RENDERING --- */
let busy = false, ctrl = null, liveBody = null, liveAct = null, raf = 0;
const cur = () => state.chats.find(c => c.id === state.active);

document.title = APP_NAME;
$("#appname").textContent = APP_NAME;

function md(t) {
  if (window.marked && window.DOMPurify) {
    const rawHtml = marked.parse(String(t ?? ""), { gfm: true, breaks: true });
    return DOMPurify.sanitize(rawHtml, {
      ALLOWED_TAGS: ["p","br","strong","em","b","i","code","pre","blockquote","ul","ol","li","h1","h2","h3","h4","a","table","thead","tbody","tr","th","td","hr","span"],
      ALLOWED_ATTR: ["href","target","rel","class"],
      ALLOW_DATA_ATTR: false
    });
  }
  return esc(t).replace(/\n/g, "<br>");
}

function enhance(el) {
  el.querySelectorAll("a").forEach(a => {
    const href = a.getAttribute("href") || "";
    if (!isSafeUrl(href)) a.removeAttribute("href");
    else { a.target = "_blank"; a.rel = "noopener noreferrer"; }
  });
  el.querySelectorAll("pre").forEach(pre => {
    if (pre.dataset.done) return;
    pre.dataset.done = "1";
    const code = pre.querySelector("code");
    if (code && window.hljs) { try { hljs.highlightElement(code); } catch {} }
    const b = document.createElement("button");
    b.type = "button";
    b.className = "copy";
    b.textContent = "Copy";
    b.onclick = () => {
      navigator.clipboard?.writeText(code ? code.innerText : pre.innerText);
      b.textContent = "Copied";
      setTimeout(() => { b.textContent = "Copy"; }, 1200);
    };
    pre.appendChild(b);
  });
}

function newChat() {
  const c = { id: "c_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 6), title: "New chat", messages: [], updated: Date.now() };
  state.chats.unshift(c);
  state.active = c.id;
  save();
  return c;
}

function renderSide() {
  const list = $("#list");
  const frag = document.createDocumentFragment();
  state.chats.forEach(c => {
    const d = document.createElement("div");
    d.className = "item" + (c.id === state.active ? " on" : "");
    const t = document.createElement("button");
    t.type = "button";
    t.className = "t";
    t.textContent = c.title || "New chat";
    t.onclick = () => {
      if (busy) return;
      state.active = c.id;
      save();
      renderAll();
      $("#side").classList.remove("open");
    };
    const x = document.createElement("button");
    x.type = "button";
    x.className = "x";
    x.textContent = "✕";
    x.setAttribute("aria-label", "Delete chat");
    x.onclick = () => {
      if (busy) return;
      state.chats = state.chats.filter(k => k.id !== c.id);
      if (state.active === c.id) state.active = null;
      save();
      renderAll();
    };
    d.append(t, x);
    frag.appendChild(d);
  });
  list.replaceChildren(frag);
}

function buildActivityEl(label, active) {
  const pill = document.createElement("div");
  pill.className = "activity" + (active ? "" : " done");
  const icon = document.createElement("span");
  icon.className = active ? "spin-ring" : "check-dot";
  const txt = document.createElement("span");
  txt.className = "act-label";
  txt.textContent = label;
  pill.append(icon, txt);
  return pill;
}

function renderMsgs() {
  const box = $("#msgs");
  liveBody = null;
  liveAct = null;
  const c = cur();
  $("#title").textContent = c ? (c.title || "New chat") : "New chat";
  $("#modelbadge").textContent = state.settings.model;

  if (!c || !c.messages.length) {
    box.innerHTML = `<div class="empty"><h1>Hello, ${esc(auth.current?.name?.split(" ")[0] || "there")}</h1><p>Ask Gavio AI anything—code, writing, commands, or quick answers.</p><div class="chips"></div></div>`;
    const chips = box.querySelector(".chips");
    ["Write a Python script to parse logs", "Run a quick Linux disk check command", "Draft a clean product spec", "Explain async/await in JavaScript"].forEach(s => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.textContent = s;
      b.onclick = () => send(s);
      chips.appendChild(b);
    });
    return;
  }

  const frag = document.createDocumentFragment();
  c.messages.forEach((m, i) => {
    const el = document.createElement("div");
    if (m.role === "user") {
      el.className = "msg user";
      const b = document.createElement("div");
      b.className = "body";
      b.textContent = m.text;
      el.appendChild(b);
    } else {
      el.className = "msg ai";
      el.innerHTML = `<span class="mark">✦</span><div class="wrap"></div>`;
      const wrap = el.querySelector(".wrap");
      const last = i === c.messages.length - 1;
      const prevUser = i > 0 && c.messages[i - 1]?.role === "user" ? c.messages[i - 1].text : "";

      if (last && busy) {
        const actLabel = m.activity || inferActivity(prevUser, m.text);
        const actEl = buildActivityEl(actLabel, true);
        wrap.appendChild(actEl);
        liveAct = actEl;
      } else if (m.activity && !m.error) {
        wrap.appendChild(buildActivityEl(m.activity, false));
      }

      const body = document.createElement("div");
      body.className = "md";
      if (last && busy) liveBody = body;
      if (m.text) {
        body.innerHTML = md(m.text);
        if (!(last && busy)) enhance(body);
      }
      wrap.appendChild(body);

      if (m.error) {
        const e = document.createElement("div");
        e.className = "err";
        e.textContent = m.error;
        wrap.appendChild(e);
      }
      if (!(last && busy)) {
        const a = document.createElement("div");
        a.className = "acts";
        const cp = document.createElement("button");
        cp.type = "button";
        cp.textContent = "Copy";
        cp.onclick = () => {
          navigator.clipboard?.writeText(m.text || "");
          cp.textContent = "Copied";
          setTimeout(() => { cp.textContent = "Copy"; }, 1200);
        };
        a.appendChild(cp);
        if (last) {
          const rg = document.createElement("button");
          rg.type = "button";
          rg.textContent = "Regenerate";
          rg.onclick = () => regenerate();
          a.appendChild(rg);
        }
        wrap.appendChild(a);
      }
    }
    frag.appendChild(el);
  });
  box.replaceChildren(frag);
  const s = $("#scroll");
  s.scrollTop = s.scrollHeight;
}

function renderAll() {
  if (!auth.current) return;
  renderSide();
  renderMsgs();
  setBusy(busy);
}

function setBusy(b) {
  busy = b;
  const s = $("#send");
  s.textContent = b ? "■" : "↑";
  s.setAttribute("aria-label", b ? "Stop" : "Send");
  s.disabled = !b && !$("#inp").value.trim();
}

function scheduleLive(m, userPrompt) {
  if (raf) return;
  raf = requestAnimationFrame(() => {
    raf = 0;
    const nextAct = inferActivity(userPrompt, m.text);
    m.activity = nextAct;
    if (liveAct) {
      const lbl = liveAct.querySelector(".act-label");
      if (lbl && lbl.textContent !== nextAct) lbl.textContent = nextAct;
    }
    if (liveBody) {
      liveBody.innerHTML = md(m.text);
      const s = $("#scroll");
      if (s.scrollHeight - s.scrollTop - s.clientHeight < 180) s.scrollTop = s.scrollHeight;
    }
  });
}

async function send(text) {
  if (!auth.current || busy) return;
  text = (text || "").trim();
  if (!text) return;
  const apiKey = (state.settings.key || DEFAULT_API_KEY).trim();
  if (!apiKey) { openSettings(); return; }
  state.settings.key = apiKey;
  let c = cur() || newChat();
  c.messages.push({ role: "user", text });
  if (c.messages.length === 1) c.title = text.slice(0, 48);
  c.messages.push({ role: "assistant", text: "", activity: inferActivity(text, "") });
  c.updated = Date.now();
  save();
  $("#inp").value = "";
  autosize();
  await generate(c, text);
}

async function regenerate() {
  if (!auth.current) return;
  const c = cur();
  if (!c || busy) return;
  const last = c.messages[c.messages.length - 1];
  const prevUser = c.messages.length > 1 && c.messages[c.messages.length - 2]?.role === "user"
    ? c.messages[c.messages.length - 2].text : "";
  if (last && last.role === "assistant") {
    last.text = "";
    last.activity = inferActivity(prevUser, "");
    delete last.error;
  } else return;
  await generate(c, prevUser);
}

async function streamModel(modelId, body, msg, signal, userPrompt) {
  const apiKey = (state.settings.key || DEFAULT_API_KEY).trim();
  const headers = { "Content-Type": "application/json", "x-goog-api-key": apiKey };
  if (apiKey.startsWith("AQ.") || apiKey.startsWith("ya29.")) {
    headers["Authorization"] = `Bearer ${apiKey}`;
  }
  const res = await fetch(`[https://generativelanguage.googleapis.com/v1beta/models/$](https://generativelanguage.googleapis.com/v1beta/models/$){encodeURIComponent(modelId)}:streamGenerateContent?alt=sse`, {
    method: "POST",
    signal,
    headers,
    body: JSON.stringify(body)
  });

  if (!res.ok) {
    const j = await res.json().catch(() => null);
    const rawMsg = (j && j.error && j.error.message) || ("Request failed (" + res.status + ")");
    const isHighDemand = res.status === 503 || /high demand|overloaded|unavailable/i.test(rawMsg);
    if (isHighDemand) return { ok: false, overloaded: true, errorMsg: rawMsg };

    let friendly = rawMsg;
    if (res.status === 429) friendly = "Rate limit reached. Wait a moment or switch models in Settings.\n" + rawMsg;
    return { ok: false, overloaded: false, errorMsg: friendly };
  }

  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "", gotText = false;

  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n")) >= 0) {
      const line = buf.slice(0, i).trim();
      buf = buf.slice(i + 1);
      if (!line.startsWith("data:")) continue;
      const d = line.slice(5).trim();
      if (!d) continue;
      try {
        const j = JSON.parse(d);
        const cand = j.candidates && j.candidates[0];
        ((cand && cand.content && cand.content.parts) || []).forEach(p => {
          if (p.text && !p.thought) { msg.text += p.text; gotText = true; }
        });
        if (j.promptFeedback && j.promptFeedback.blockReason) {
          msg.error = "Blocked by safety filter: " + j.promptFeedback.blockReason;
        }
        if (cand && cand.finishReason && !["STOP", "MAX_TOKENS"].includes(cand.finishReason) && !msg.text) {
          if (/high demand|overloaded|unavailable/i.test(cand.finishReason)) {
            return { ok: false, overloaded: true, errorMsg: cand.finishReason };
          }
          msg.error = "Stopped: " + cand.finishReason;
        }
      } catch {}
    }
    scheduleLive(msg, userPrompt);
  }

  return { ok: gotText || Boolean(msg.error), overloaded: false, errorMsg: "The model returned an empty response." };
}

async function generate(c, userPrompt = "") {
  if (!auth.current) return;
  const st = state.settings, msg = c.messages[c.messages.length - 1];
  msg.text = "";
  msg.activity = inferActivity(userPrompt, "");
  delete msg.error;
  ctrl = new AbortController();
  busy = true;
  renderAll();

  const preferred = (st.model || defaults.model).replace(/^models\//, "");
  const candidates = Array.from(new Set([preferred, ...FALLBACK_CHAIN]));

  const contents = c.messages.slice(0, -1).filter(m => m.text).map(m => ({
    role: m.role === "user" ? "user" : "model",
    parts: [{ text: m.text }]
  }));
  const body = { contents, generationConfig: { temperature: Number(st.temp) } };
  if (st.system.trim()) body.systemInstruction = { parts: [{ text: st.system.trim() }] };

  try {
    let completed = false;
    for (let idx = 0; idx < candidates.length; idx++) {
      const mId = candidates[idx];
      for (let attempt = 0; attempt < 2; attempt++) {
        msg.text = "";
        if (idx > 0 || attempt > 0) {
          msg.activity = "Retrying on backup capacity";
          renderMsgs();
        }
        const out = await streamModel(mId, body, msg, ctrl.signal, userPrompt);
        if (out.ok) {
          msg.activity = "Completed";
          completed = true;
          break;
        }
        if (out.overloaded) {
          if (attempt === 0) {
            await sleep(300 + Math.random() * 250, ctrl.signal);
            continue;
          }
          break;
        } else {
          if (!msg.error) msg.error = out.errorMsg;
          completed = true;
          break;
        }
      }
      if (completed) break;
    }

    if (!completed && !msg.text && !msg.error) {
      msg.error = "Models are currently busy. Please try again shortly.";
    }
  } catch (e) {
    if (e.name !== "AbortError") msg.error = e.message || String(e);
  } finally {
    busy = false;
    ctrl = null;
    c.updated = Date.now();
    save();
    renderAll();
  }
}

const inp = $("#inp");
function autosize() {
  inp.style.height = "auto";
  inp.style.height = Math.min(inp.scrollHeight, 200) + "px";
  setBusy(busy);
}
inp.addEventListener("input", autosize);
inp.addEventListener("keydown", e => {

});
document.addEventListener("keydown", e => {
  if (!auth.current) return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    $("#newchat").click();
  }
});
$("#send").onclick = () => { if (busy) { ctrl && ctrl.abort(); } else send(inp.value); };
$("#newchat").onclick = () => {

function submitGoogleEmail() {
  const err = $("#a-err");
  err.classList.remove("auth-ok");
  const clean = ($("#g-email").value || "").trim().toLowerCase();
  if (!looksLikeEmail(clean)) {
    err.textContent = "Enter a valid Google email address.";
    return;
  }
  const rawName = clean.split("@")[0].replace(/[._-]+/g, " ");
  const name = rawName.replace(/\b\w/g, c => c.toUpperCase()) || "Google User";
  err.textContent = "";
  setSession({ name, email: clean });
}

};

$("#aform").addEventListener("submit", async e => {
  e.preventDefault();
  const err = $("#a-err");
  err.classList.remove("auth-ok");
  err.textContent = "";

  const email = ($("#a-email").value || "").trim().toLowerCase();
  const pass = $("#a-pass").value || "";
  const name = ($("#a-name").value || "").trim();

  if (!looksLikeEmail(email)) {
    err.textContent = "Please enter a valid email address.";
    return;
  }
  if (pass.length < 4) {
    err.textContent = "Password must be at least 4 characters.";
    return;
  }

  try {
    if (authMode === "register") {
      if (auth.users[email]) {
        err.textContent = "Account already exists. Click Sign In above.";
        return;
      }
      const salt = randomSalt();
      const hash = await hashPassword(pass, salt);
      const displayName = name || email.split("@")[0];
      auth.users[email] = { name: displayName, email, salt, hash };
      saveAuthStore();
      $("#aform").reset();
      setSession({ name: displayName, email });
    } else {
      const u = auth.users[email];
      if (!u) {
        err.textContent = "No account found for this email. Click Register to create one.";
        return;
      }
      const computed = await hashPassword(pass, u.salt || "");
      if (computed !== u.hash) {
        err.textContent = "Incorrect password.";
        return;
      }
      $("#aform").reset();
      setSession({ name: u.name, email: u.email, pic: u.pic });
    }
  } catch (ex) {
    err.textContent = "Sign-in error: " + (ex && ex.message ? ex.message : "Please try again.");
  }
});

function parseJwt(token) {
  const parts = String(token || "").split(".");
  if (parts.length !== 3) throw new Error("Invalid token");
  const base64 = parts[1].replace(/-/g, "+").replace(/_/g, "/");
  return JSON.parse(decodeURIComponent(atob(base64).split("").map(c => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2)).join("")));
}

let gsiReady = false;
function initGoogleAuth() {
  if (GOOGLE_CLIENT_ID && window.google?.accounts?.id) {
    $("#g-fallback").style.display = "none";
    $("#g-inline").classList.remove("open");
    if (!gsiReady) {
      gsiReady = true;
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: res => {
          try {
            const p = parseJwt(res.credential);
            if (p.email) setSession({ name: p.name, email: p.email, pic: p.picture });
          } catch {
            $("#a-err").textContent = "Google sign-in verification failed.";
          }
        }
      });
    }
    google.accounts.id.renderButton($("#g-btn-wrap"), { theme: "filled_black", size: "large", width: 368 });
  }
}

applyGate();
</script>
