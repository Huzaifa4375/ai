<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<style>
:root{
  --bg:#f5f6fa; --panel:#ffffff; --side:#eceef5; --line:#dde0ec; --text:#1a1f36; --mute:#6b7190;
  --accent:#4c5cf0; --accent-ink:#ffffff; --user:#e6e9fb; --code:#0f1320; --err:#c0344a; --errbg:#fbe9ec;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e111b; --panel:#151a28; --side:#0b0d15; --line:#252c42; --text:#e7eaf5; --mute:#8a92b2;
    --accent:#7d8bff; --accent-ink:#0b0e1a; --user:#1c2340; --code:#090c15; --err:#ff8196; --errbg:#2a1520;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.6 "Instrument Sans",system-ui,sans-serif;display:flex;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* sidebar */
#side{width:272px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;transition:transform .2s}
.brand{padding:18px 16px 10px;font-weight:600;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.mark{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-size:14px;font-weight:600}
#newchat{margin:6px 12px 10px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);text-align:left;font-weight:500}
#newchat:hover{border-color:var(--accent)}
#list{flex:1;overflow-y:auto;padding:0 8px}
.item{display:flex;align-items:center;gap:4px;border-radius:8px;padding:0 4px 0 10px}
.item:hover,.item.on{background:var(--panel)}
.item .t{flex:1;min-width:0;padding:8px 0;border:0;background:none;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .x{border:0;background:none;color:var(--mute);padding:4px 8px;border-radius:6px;opacity:0}
.item:hover .x,.item .x:focus-visible{opacity:1}
.item .x:hover{color:var(--err)}
.sidefoot{padding:12px;border-top:1px solid var(--line)}
.sidefoot button{width:100%;padding:9px 12px;border-radius:10px;border:0;background:none;text-align:left;color:var(--mute)}
.sidefoot button:hover{background:var(--panel);color:var(--text)}

/* main */
main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line)}
#menu{display:none;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px}
#title{font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#modelbadge{font:12px "JetBrains Mono",monospace;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
#scroll{flex:1;overflow-y:auto;scroll-behavior:smooth}
.col{max-width:760px;margin:0 auto;padding:24px 20px 12px}

.empty{padding-top:12vh}
.empty h1{font-size:clamp(28px,5vw,42px);line-height:1.15;letter-spacing:-.025em;margin:0 0 10px;font-weight:600}
.empty p{color:var(--mute);margin:0 0 26px;max-width:46ch}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px}
.chip:hover{border-color:var(--accent)}

.msg{margin:0 0 26px}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .body{background:var(--user);padding:10px 15px;border-radius:16px 16px 4px 16px;max-width:85%;white-space:pre-wrap;word-wrap:break-word}
.msg.ai{display:flex;gap:12px}
.msg.ai .mark{margin-top:2px;flex-shrink:0}
.msg.ai .wrap{min-width:0;flex:1}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md p,.md ul,.md ol,.md pre,.md table,.md blockquote{margin:0 0 14px}
.md h1,.md h2,.md h3{line-height:1.25;margin:22px 0 10px;letter-spacing:-.01em}
.md h1{font-size:22px}.md h2{font-size:19px}.md h3{font-size:16px}
.md a{color:var(--accent)}
.md blockquote{border-left:3px solid var(--line);padding-left:14px;color:var(--mute)}
.md table{border-collapse:collapse;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:6px 12px;text-align:left}
.md code{font:13.5px "JetBrains Mono",monospace;background:var(--user);padding:2px 6px;border-radius:5px}
.md pre{position:relative;background:var(--code);border-radius:12px;overflow:hidden}
.md pre code{display:block;background:none;padding:16px;overflow-x:auto;color:#e6e9f5;line-height:1.55}
.copy{position:absolute;top:8px;right:8px;border:1px solid #2c3550;background:#151b2e;color:#aab2d0;border-radius:7px;padding:2px 9px;font-size:12px}
.copy:hover{color:#fff}
.acts{display:flex;gap:4px;margin-top:8px}
.acts button{border:0;background:none;color:var(--mute);padding:3px 8px;border-radius:6px;font-size:13px}
.acts button:hover{background:var(--user);color:var(--text)}
.err{background:var(--errbg);color:var(--err);padding:10px 14px;border-radius:10px;margin-top:8px;font-size:14px}
.dots{display:inline-flex;gap:4px;padding:8px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:b 1.1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.25}30%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}#scroll{scroll-behavior:auto}}

/* composer */
#comp{padding:0 20px 18px}
#box{max-width:760px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;display:flex;align-items:flex-end;gap:8px;padding:8px 8px 8px 16px}
#box:focus-within{border-color:var(--accent)}
#inp{flex:1;border:0;background:none;color:inherit;font:inherit;resize:none;max-height:200px;padding:7px 0;outline:none}
#send{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;width:40px;height:40px;font-size:18px;flex-shrink:0}
#send:disabled{opacity:.4;cursor:default}
.hint{text-align:center;color:var(--mute);font-size:12px;margin-top:8px}

/* settings */
dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--text);padding:0;width:min(480px,92vw)}
dialog::backdrop{background:rgba(5,8,18,.55)}
dialog form{padding:22px;display:flex;flex-direction:column;gap:14px}
dialog h2{margin:0;font-size:18px}
dialog label{display:flex;flex-direction:column;gap:5px;font-weight:500;font-size:14px}
dialog small{color:var(--mute);font-weight:400}
dialog input,dialog textarea{border:1px solid var(--line);background:var(--bg);color:inherit;border-radius:9px;padding:9px 11px;font:inherit}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:4px}
.btn{border:1px solid var(--line);background:none;border-radius:10px;padding:8px 16px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
dialog a{color:var(--accent)}

@media (max-width:760px){
  #side{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%)}
  #side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}
  #menu{display:block}
  #modelbadge{display:none}
}
</style>
</head>
<body>

<aside id="side">
  <div class="brand"><span class="mark">✦</span><span id="appname"></span></div>
  <button id="newchat">New chat</button>
  <div id="list"></div>
  <div class="sidefoot"><button id="opensettings">Settings</button></div>
</aside>

<main>
  <header>
    <button id="menu" aria-label="Open chats">☰</button>
    <div id="title">New chat</div>
    <span id="modelbadge"></span>
  </header>
  <div id="scroll"><div class="col" id="msgs"></div></div>
  <div id="comp">
    <div id="box">
      <textarea id="inp" rows="1" placeholder="Message…" aria-label="Message"></textarea>
      <button id="send" aria-label="Send">↑</button>
    </div>
    <div class="hint">Enter to send · Shift+Enter for a new line</div>
  </div>
</main>

<dialog id="dlg">
  <form method="dialog" id="sform">
    <h2>Settings</h2>
    <label>Gemini API key
      <input id="s-key" type="password" autocomplete="off" placeholder="AIza…">
      <small>Get a free key at <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>. It stays in this browser.</small>
    </label>
    <label>Model
      <input id="s-model" list="models" placeholder="gemini-2.5-flash">
      <datalist id="models">
        <option value="gemini-2.5-flash"><option value="gemini-2.5-flash-lite"><option value="gemini-2.5-pro">
      </datalist>
      <small>Any model name from AI Studio works.</small>
    </label>
    <label>System instructions
      <textarea id="s-sys" rows="3" placeholder="e.g. You are a helpful assistant."></textarea>
    </label>
    <label>Temperature <small id="s-tv"></small>
      <input id="s-temp" type="range" min="0" max="2" step="0.1">
    </label>
    <div class="row">
      <button type="button" class="btn" id="s-cancel">Cancel</button>
      <button type="submit" class="btn pri" id="s-save">Save</button>
    </div>
  </form>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
const APP_NAME = "My AI";            // change the name here
const KEY = "ai_chat_v1";
const $ = s => document.querySelector(s);

const defaults = { key:"", model:"gemini-2.5-flash", system:"", temp:0.7 };
let state = (() => { try { return JSON.parse(localStorage.getItem(KEY)) } catch { return null } })() || {};
state.chats = state.chats || [];
state.settings = Object.assign({}, defaults, state.settings);
let busy = false, ctrl = null, liveBody = null, raf = 0;

const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)) } catch {} };
const cur = () => state.chats.find(c => c.id === state.active);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

document.title = APP_NAME;
$("#appname").textContent = APP_NAME;

function md(t) {
  if (window.marked && window.DOMPurify) {
    return DOMPurify.sanitize(marked.parse(t, { gfm:true, breaks:true }), { ADD_ATTR:["target"] });
  }
  return esc(t).replace(/\n/g, "<br>");
}
function enhance(el) {
  el.querySelectorAll("a").forEach(a => { a.target = "_blank"; a.rel = "noopener noreferrer"; });
  el.querySelectorAll("pre").forEach(pre => {
    const code = pre.querySelector("code");
    if (code && window.hljs) { try { hljs.highlightElement(code); } catch {} }
    const b = document.createElement("button");
    b.className = "copy"; b.textContent = "Copy";
    b.onclick = () => { navigator.clipboard.writeText(pre.innerText.replace(/Copy$/, "").trim()); b.textContent = "Copied"; setTimeout(() => b.textContent = "Copy", 1200); };
    pre.appendChild(b);
  });
}

function newChat() {
  const c = { id: "c" + Date.now(), title: "New chat", messages: [], updated: Date.now() };
  state.chats.unshift(c); state.active = c.id; save(); return c;
}

function renderSide() {
  const list = $("#list"); list.innerHTML = "";
  state.chats.forEach(c => {
    const d = document.createElement("div"); d.className = "item" + (c.id === state.active ? " on" : "");
    const t = document.createElement("button"); t.className = "t"; t.textContent = c.title;
    t.onclick = () => { if (busy) return; state.active = c.id; save(); renderAll(); $("#side").classList.remove("open"); };
    const x = document.createElement("button"); x.className = "x"; x.textContent = "✕"; x.setAttribute("aria-label", "Delete chat");
    x.onclick = () => { if (busy) return; state.chats = state.chats.filter(k => k.id !== c.id); if (state.active === c.id) state.active = null; save(); renderAll(); };
    d.append(t, x); list.appendChild(d);
  });
}

function renderMsgs() {
  const box = $("#msgs"); box.innerHTML = ""; liveBody = null;
  const c = cur();
  $("#title").textContent = c ? c.title : "New chat";
  $("#modelbadge").textContent = state.settings.model;
  if (!c || !c.messages.length) {
    box.innerHTML = `<div class="empty"><h1>What are we working on?</h1><p>Ask a question, paste some code, or draft something together.</p><div class="chips"></div></div>`;
    ["Explain how DNS works", "Write a bash script to back up a folder", "Help me write a product description", "Summarize pros and cons of KVM vs LXC"].forEach(s => {
      const b = document.createElement("button"); b.className = "chip"; b.textContent = s; b.onclick = () => send(s);
      box.querySelector(".chips").appendChild(b);
    });
    return;
  }
  c.messages.forEach((m, i) => {
    const el = document.createElement("div");
    if (m.role === "user") {
      el.className = "msg user"; const b = document.createElement("div"); b.className = "body"; b.textContent = m.text; el.appendChild(b);
    } else {
      el.className = "msg ai";
      el.innerHTML = `<span class="mark">✦</span><div class="wrap"><div class="md"></div></div>`;
      const body = el.querySelector(".md"), wrap = el.querySelector(".wrap");
      const last = i === c.messages.length - 1;
      if (last && busy) liveBody = body;
      if (m.text) { body.innerHTML = md(m.text); enhance(body); }
      else if (last && busy) body.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
      if (m.error) { const e = document.createElement("div"); e.className = "err"; e.textContent = m.error; wrap.appendChild(e); }
      if (!(last && busy)) {
        const a = document.createElement("div"); a.className = "acts";
        const cp = document.createElement("button"); cp.textContent = "Copy";
        cp.onclick = () => { navigator.clipboard.writeText(m.text); cp.textContent = "Copied"; setTimeout(() => cp.textContent = "Copy", 1200); };
        a.appendChild(cp);
        if (last) { const rg = document.createElement("button"); rg.textContent = "Regenerate"; rg.onclick = () => regenerate(); a.appendChild(rg); }
        wrap.appendChild(a);
      }
    }
    box.appendChild(el);
  });
  const s = $("#scroll"); s.scrollTop = s.scrollHeight;
}
function renderAll() { renderSide(); renderMsgs(); setBusy(busy); }

function setBusy(b) {
  busy = b;
  const s = $("#send"); s.textContent = b ? "■" : "↑"; s.setAttribute("aria-label", b ? "Stop" : "Send");
  s.disabled = !b && !$("#inp").value.trim();
}

function scheduleLive(m) {
  if (raf) return;
  raf = requestAnimationFrame(() => {
    raf = 0;
    if (!liveBody) return;
    liveBody.innerHTML = md(m.text); enhance(liveBody);
    const s = $("#scroll"); if (s.scrollHeight - s.scrollTop - s.clientHeight < 160) s.scrollTop = s.scrollHeight;
  });
}

async function send(text) {
  if (busy) return;
  text = (text || "").trim(); if (!text) return;
  if (!state.settings.key) { openSettings(); return; }
  let c = cur() || newChat();
  c.messages.push({ role: "user", text });
  if (c.messages.length === 1) c.title = text.slice(0, 48);
  c.messages.push({ role: "assistant", text: "" });
  c.updated = Date.now(); save();
  $("#inp").value = ""; autosize();
  await generate(c);
}

async function regenerate() {
  const c = cur(); if (!c || busy) return;
  const last = c.messages[c.messages.length - 1];
  if (last && last.role === "assistant") { last.text = ""; delete last.error; } else return;
  await generate(c);
}

async function generate(c) {
  const st = state.settings, msg = c.messages[c.messages.length - 1];
  msg.text = ""; delete msg.error;
  ctrl = new AbortController(); busy = true; renderAll();
  const contents = c.messages.slice(0, -1).filter(m => m.text).map(m => ({ role: m.role === "user" ? "user" : "model", parts: [{ text: m.text }] }));
  const body = { contents, generationConfig: { temperature: Number(st.temp) } };
  if (st.system.trim()) body.systemInstruction = { parts: [{ text: st.system.trim() }] };
  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(st.model)}:streamGenerateContent?alt=sse`, {
      method: "POST", signal: ctrl.signal,
      headers: { "Content-Type": "application/json", "x-goog-api-key": st.key },
      body: JSON.stringify(body)
    });
    if (!res.ok) {
      const j = await res.json().catch(() => null);
      let m = (j && j.error && j.error.message) || ("Request failed (" + res.status + ")");
      if (res.status === 429) m = "Rate limit reached on the free tier. Wait a minute, or switch to a lighter model in Settings.\n" + m;
      throw new Error(m);
    }
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { done, value } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!line.startsWith("data:")) continue;
        const d = line.slice(5).trim(); if (!d) continue;
        try {
          const j = JSON.parse(d);
          const cand = j.candidates && j.candidates[0];
          ((cand && cand.content && cand.content.parts) || []).forEach(p => { if (p.text && !p.thought) msg.text += p.text; });
          if (j.promptFeedback && j.promptFeedback.blockReason) msg.error = "Blocked by safety filter: " + j.promptFeedback.blockReason;
          if (cand && cand.finishReason && !["STOP", "MAX_TOKENS"].includes(cand.finishReason) && !msg.text) msg.error = "Stopped: " + cand.finishReason;
        } catch {}
      }
      scheduleLive(msg);
    }
    if (!msg.text && !msg.error) msg.error = "The model returned an empty response.";
  } catch (e) {
    if (e.name !== "AbortError") msg.error = e.message || String(e);
  } finally {
    busy = false; ctrl = null; c.updated = Date.now(); save(); renderAll();
  }
}

/* composer */
const inp = $("#inp");
function autosize() { inp.style.height = "auto"; inp.style.height = Math.min(inp.scrollHeight, 200) + "px"; setBusy(busy); }
inp.addEventListener("input", autosize);
inp.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(inp.value); } });
$("#send").onclick = () => { if (busy) { ctrl && ctrl.abort(); } else send(inp.value); };
$("#newchat").onclick = () => { if (busy) return; state.active = null; save(); renderAll(); $("#side").classList.remove("open"); inp.focus(); };
$("#menu").onclick = () => $("#side").classList.toggle("open");
$("#scroll").addEventListener("click", () => $("#side").classList.remove("open"));

/* settings */
const dlg = $("#dlg");
function openSettings() {
  const s = state.settings;
  $("#s-key").value = s.key; $("#s-model").value = s.model; $("#s-sys").value = s.system; $("#s-temp").value = s.temp; $("#s-tv").textContent = s.temp;
  dlg.showModal();
}
$("#opensettings").onclick = openSettings;
$("#s-temp").oninput = e => $("#s-tv").textContent = e.target.value;
$("#s-cancel").onclick = () => dlg.close();
$("#sform").onsubmit = () => {
  state.settings = { key: $("#s-key").value.trim(), model: $("#s-model").value.trim() || defaults.model, system: $("#s-sys").value, temp: $("#s-temp").value };
  save(); renderAll();
};

renderAll();
if (!state.settings.key) setTimeout(openSettings, 300);
</script>
</body>
</html>
